function getDailyLogs(date){ return gl('s60dl_'+date, []); }
function saveDailyLogs(date, logs){ sl('s60dl_'+date, logs); }

let dlDate = tod();
let dlShowAdd = false;
let dlEditId = null;

function renderDailyLog(){
  const p = document.getElementById('panel-dailylog');
  if(!p) return;

  const logs = getDailyLogs(dlDate);
  const today = tod();

  // ── STATS for today ──
  const totalTime = logs.reduce((a,l)=>a+(parseInt(l.mins)||0),0);
  const totalTasks = logs.length;
  const doneCount = logs.filter(l=>l.done).length;
  const subjectSet = [...new Set(logs.filter(l=>l.subject).map(l=>l.subject))];

  // ── STREAK: consecutive days with at least 1 log ──
  let streak = 0;
  for(let i=0;i<60;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    if(getDailyLogs(ds).length>0) streak++;
    else break;
  }

  // ── WEEK SUMMARY ──
  const weekData = [];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    const wlogs=getDailyLogs(ds);
    const wmins=wlogs.reduce((a,l)=>a+(parseInt(l.mins)||0),0);
    weekData.push({date:ds, day:d.toLocaleDateString('en-IN',{weekday:'short'}), tasks:wlogs.length, mins:wmins, isToday:ds===today});
  }

  // ── TYPE BREAKDOWN ──
  const typeCount={};
  logs.forEach(l=>{typeCount[l.type]=(typeCount[l.type]||0)+1;});

  p.innerHTML = `
  <!-- DATE NAV -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px">
    <button id="dl-prev" style="padding:6px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;cursor:pointer">‹ Prev</button>
    <div style="text-align:center">
      <div style="font-size:13px;font-weight:900;color:var(--white)">${dlDate===today?'📅 Today':dlDate}</div>
      <div style="font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace">${new Date(dlDate).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short',year:'numeric'})}</div>
    </div>
    <button id="dl-next" style="padding:6px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:12px;cursor:pointer">Next ›</button>
  </div>

  <!-- STATS ROW -->
  <div class="sg2" style="margin-bottom:14px">
    <div class="sc card-glow-blue"><div style="font-size:7px;color:var(--muted);letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;margin-bottom:4px">TASKS</div><div class="sn" style="color:var(--accent)">${totalTasks}</div><div class="sl2">Logged Today</div><div class="sb2" style="background:var(--accent)"></div></div>
    <div class="sc" style="border-color:rgba(16,185,129,.25)"><div style="font-size:7px;color:var(--muted);letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;margin-bottom:4px">DONE</div><div class="sn" style="color:#10b981">${doneCount}</div><div class="sl2">Completed</div><div class="sb2" style="background:#10b981"></div></div>
    <div class="sc" style="border-color:rgba(245,158,11,.25)"><div style="font-size:7px;color:var(--muted);letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;margin-bottom:4px">TIME</div><div class="sn" style="color:var(--amber)">${totalTime>=60?Math.floor(totalTime/60)+'h '+(totalTime%60)+'m':totalTime+'m'}</div><div class="sl2">Studied</div><div class="sb2" style="background:var(--amber)"></div></div>
    <div class="sc" style="border-color:rgba(236,72,153,.25)"><div style="font-size:7px;color:var(--muted);letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;margin-bottom:4px">STREAK</div><div class="sn" style="color:#ec4899">${streak}🔥</div><div class="sl2">Day Streak</div><div class="sb2" style="background:#ec4899"></div></div>
  </div>

  <!-- WEEK BAR CHART -->
  <div class="pc" style="margin-bottom:14px">
    <div class="sl" style="color:var(--cyan)">📅 This Week</div>
    <div style="display:flex;gap:4px;align-items:flex-end;height:60px;margin-bottom:6px">
      ${weekData.map(w=>{
        const maxMins = Math.max(...weekData.map(x=>x.mins),1);
        const h = Math.max(4, Math.round((w.mins/maxMins)*52));
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
          <div style="font-size:7px;color:var(--muted);font-family:'JetBrains Mono',monospace">${w.mins>=60?Math.floor(w.mins/60)+'h':w.mins?w.mins+'m':''}</div>
          <div style="width:100%;height:${h}px;border-radius:5px 5px 0 0;background:${w.isToday?'linear-gradient(180deg,var(--accent),var(--accent2))':w.tasks>0?'rgba(59,130,246,.3)':'var(--border)'};transition:all .3s;position:relative" title="${w.date}: ${w.tasks} tasks, ${w.mins}min"></div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:4px">
      ${weekData.map(w=>`<div style="flex:1;text-align:center">
        <div style="font-size:7px;color:${w.isToday?'var(--accent)':'var(--muted)'};font-weight:${w.isToday?900:600};font-family:'JetBrains Mono',monospace">${w.day}</div>
        <div style="font-size:8px;color:${w.tasks>0?'#10b981':'var(--border2)'};font-weight:800">${w.tasks||'·'}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- SUBJECTS COVERED -->
  ${subjectSet.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    ${subjectSet.map(s=>`<span style="padding:3px 10px;border-radius:20px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd;font-size:9px;font-weight:700">📚 ${s}</span>`).join('')}
  </div>`:''}

  <!-- ADD TASK BUTTON -->
  <div style="margin-bottom:12px">
    ${dlDate===today?`<button id="dl-add-btn" style="width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);background:rgba(59,130,246,.05);color:var(--accent);font-size:12px;font-weight:800;cursor:pointer;transition:all .2s;font-family:'Rajdhani',sans-serif">
      + Log a Study Task
    </button>`:'<div style="font-size:10px;color:var(--muted);text-align:center;padding:8px">Past date — view only</div>'}
  </div>

  <!-- ADD FORM -->
  ${dlShowAdd?`<div class="pc card-glow-blue" style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:800;color:var(--white);margin-bottom:12px">${dlEditId?'✏️ Edit Task':'✅ Log Study Task'}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div>
        <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">TASK TYPE</div>
        <select id="dl-type" class="inp" style="width:100%;font-size:11px">
          ${DAILY_TASK_TYPES.map(t=>`<option value="${t.key}" ${(dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.type:'')==t.key?'selected':''}>${t.icon} ${t.label}</option>`).join('')}
        </select>
      </div>
      <div>
        <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">SUBJECT</div>
        <input id="dl-subject" class="inp" style="width:100%" placeholder="e.g. Maths, Physics" value="${dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.subject||'':''}">
      </div>
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">TOPIC / DESCRIPTION</div>
      <input id="dl-topic" class="inp" style="width:100%" placeholder="e.g. Chapter 5 — Trigonometry, Vocabulary Day 12..." value="${dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.topic||'':''}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
      <div>
        <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">TIME (MINS)</div>
        <input id="dl-mins" class="inp" type="number" min="1" max="480" style="width:100%" placeholder="30" value="${dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.mins||'':''}">
      </div>
      <div>
        <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">START TIME</div>
        <input id="dl-start" class="inp" type="time" style="width:100%" value="${dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.startTime||'':''}">
      </div>
      <div>
        <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">STATUS</div>
        <select id="dl-done" class="inp" style="width:100%;font-size:11px">
          <option value="1" ${dlEditId&&getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.done?'selected':''}>✅ Done</option>
          <option value="0" ${dlEditId&&!getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.done?'selected':''}>⏳ In Progress</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:8px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">NOTES (OPTIONAL)</div>
      <textarea id="dl-notes" class="inp" style="width:100%;height:60px;resize:none" placeholder="Key points, formulas covered, pages read...">${dlEditId?getDailyLogs(dlDate).find(l=>l.id===dlEditId)?.notes||'':''}</textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button id="dl-save-btn" class="btn bp2" style="flex:1">💾 Save Task</button>
      <button id="dl-cancel-btn" class="btn bg2">Cancel</button>
    </div>
  </div>`:''}

  <!-- TASK LIST -->
  <div class="pc">
    <div class="sl" style="color:var(--green)">📋 Tasks Logged — ${dlDate===today?'Today':dlDate} (${totalTasks})</div>
    ${logs.length===0?`<div style="text-align:center;padding:28px;color:var(--muted)">
      <div style="font-size:32px;margin-bottom:8px">📭</div>
      <div style="font-size:11px">No tasks logged yet. ${dlDate===today?'Tap "+ Log a Study Task" to add one!':''}</div>
    </div>`:logs.map((log,i)=>{
      const tt = DAILY_TASK_TYPES.find(t=>t.key===log.type)||DAILY_TASK_TYPES[0];
      return `<div style="padding:11px 0;border-bottom:${i<logs.length-1?'1px solid var(--border)':'none'}">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="width:36px;height:36px;border-radius:10px;background:${tt.color}18;border:1px solid ${tt.color}35;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${tt.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
              <span style="font-size:12px;font-weight:800;color:var(--white)">${log.topic||'Untitled'}</span>
              <span style="font-size:8px;padding:1px 7px;border-radius:20px;background:${log.done?'rgba(16,185,129,.12)':'rgba(245,158,11,.1)'};border:1px solid ${log.done?'rgba(16,185,129,.3)':'rgba(245,158,11,.3)'};color:${log.done?'#10b981':'var(--amber)'}">
                ${log.done?'✅ Done':'⏳ In Progress'}
              </span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:9px;color:var(--muted)">
              ${log.subject?`<span style="color:${tt.color};font-weight:700">${log.subject}</span>`:''}
              <span style="padding:1px 6px;border-radius:4px;background:${tt.color}12;color:${tt.color};font-weight:700">${tt.label}</span>
              ${log.mins?`<span>⏱️ ${log.mins>=60?Math.floor(log.mins/60)+'h '+(log.mins%60)+'m':log.mins+'m'}</span>`:''}
              ${log.startTime?`<span>🕐 ${log.startTime}</span>`:''}
            </div>
            ${log.notes?`<div style="margin-top:5px;font-size:9px;color:var(--muted);padding:5px 8px;background:var(--card2);border-radius:6px;line-height:1.5">${log.notes}</div>`:''}
          </div>
          ${dlDate===today?`<div style="display:flex;gap:4px;flex-shrink:0">
            <button id="dl-toggle-${log.id}" style="padding:4px 8px;border-radius:7px;border:1px solid ${log.done?'rgba(245,158,11,.4)':'rgba(16,185,129,.4)'};background:transparent;color:${log.done?'var(--amber)':'#10b981'};font-size:9px;cursor:pointer;font-weight:800">${log.done?'Undo':'Done'}</button>
            <button id="dl-edit-${log.id}" style="padding:4px 8px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:9px;cursor:pointer">✏️</button>
            <button id="dl-del-${log.id}" style="padding:4px 8px;border-radius:7px;border:1px solid rgba(239,68,68,.3);background:transparent;color:#ef4444;font-size:9px;cursor:pointer">🗑</button>
          </div>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  // ── ATTACH LISTENERS ──
  const prevBtn = document.getElementById('dl-prev');
  const nextBtn = document.getElementById('dl-next');
  if(prevBtn) prevBtn.addEventListener('click',()=>{
    const d=new Date(dlDate); d.setDate(d.getDate()-1);
    dlDate=d.toISOString().slice(0,10); dlShowAdd=false; renderDailyLog();
  });
  if(nextBtn) nextBtn.addEventListener('click',()=>{
    const d=new Date(dlDate); d.setDate(d.getDate()+1);
    const nd=d.toISOString().slice(0,10);
    if(nd<=tod()){ dlDate=nd; dlShowAdd=false; renderDailyLog(); }
  });

  const addBtn = document.getElementById('dl-add-btn');
  if(addBtn) addBtn.addEventListener('click',()=>{dlShowAdd=true;dlEditId=null;renderDailyLog();setTimeout(()=>document.getElementById('dl-type')&&document.getElementById('dl-type').focus(),100);});

  const saveBtn = document.getElementById('dl-save-btn');
  if(saveBtn) saveBtn.addEventListener('click',()=>{
    const type = document.getElementById('dl-type')?.value||'subject';
    const subject = document.getElementById('dl-subject')?.value.trim()||'';
    const topic = document.getElementById('dl-topic')?.value.trim()||'';
    const mins = parseInt(document.getElementById('dl-mins')?.value)||0;
    const startTime = document.getElementById('dl-start')?.value||'';
    const done = document.getElementById('dl-done')?.value==='1';
    const notes = document.getElementById('dl-notes')?.value.trim()||'';
    if(!topic){ fl('❗ Enter a topic/description','#ef4444'); return; }
    const logs = getDailyLogs(dlDate);
    if(dlEditId){
      const idx=logs.findIndex(l=>l.id===dlEditId);
      if(idx>-1) logs[idx]={...logs[idx],type,subject,topic,mins,startTime,done,notes};
    } else {
      logs.push({id:Date.now().toString(36),type,subject,topic,mins,startTime,done,notes,added:new Date().toISOString()});
    }
    saveDailyLogs(dlDate,logs);
    dlShowAdd=false; dlEditId=null;
    fl('✅ Task saved!'); renderDailyLog();
  });

  const cancelBtn = document.getElementById('dl-cancel-btn');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{dlShowAdd=false;dlEditId=null;renderDailyLog();});

  // Per-task buttons
  logs.forEach(log=>{
    const tb=document.getElementById('dl-toggle-'+log.id);
    if(tb) tb.addEventListener('click',()=>{
      const ls=getDailyLogs(dlDate);
      const l=ls.find(x=>x.id===log.id); if(l){l.done=!l.done; saveDailyLogs(dlDate,ls); renderDailyLog();}
    });
    const eb=document.getElementById('dl-edit-'+log.id);
    if(eb) eb.addEventListener('click',()=>{dlShowAdd=true;dlEditId=log.id;renderDailyLog();});
    const db=document.getElementById('dl-del-'+log.id);
    if(db) db.addEventListener('click',()=>{
      if(!confirm('Delete this task?')) return;
      const ls=getDailyLogs(dlDate).filter(x=>x.id!==log.id);
      saveDailyLogs(dlDate,ls); renderDailyLog();
    });
  });
}

// Active subject for inline preview
let subHubActive = null;

function renderSubjects() {
  const p = document.getElementById('panel-subjects');
  if (!p) return;

  // Calculate progress for all subjects
  const progData = {};
  Object.keys(SUBS).forEach(sk => {
    const sub = SUBS[sk];
    const data = gT(sk);
    const tops = gTops(sub);
    progData[sk] = cPct(data, tops, sub.cols);
  });

  // Overall stats
  const totalTopics = Object.keys(SUBS).reduce((a,sk) => a + gTops(SUBS[sk]).length, 0);
  const doneTopics  = Object.keys(SUBS).reduce((a,sk) => {
    const sub = SUBS[sk], data = gT(sk), tops = gTops(sub);
    const bc = sub.cols.filter(c => ['classYes','theoryYes','pyqYes','assignYes','bookYes'].includes(c));
    return a + tops.filter(t => bc.every(c => (data[String(t.id)]||{})[c])).length;
  }, 0);
  const overallPct = totalTopics ? Math.round(doneTopics / totalTopics * 100) : 0;

  // Build groups
  const groupsHtml = SUB_GROUPS.map(grp => {
    const grpSubjects = grp.subjects;
    const grpPct = Math.round(grpSubjects.reduce((a,s) => a + (progData[s.sk]||0), 0) / grpSubjects.length);

    const cards = grpSubjects.map(s => {
      const pct = progData[s.sk] || 0;
      const sub = SUBS[s.sk];
      const tops = gTops(sub);
      const bc = sub.cols.filter(c => ['classYes','theoryYes','pyqYes','assignYes','bookYes'].includes(c));
      const data = gT(s.sk);
      const done = tops.filter(t => bc.every(c => (data[String(t.id)]||{})[c])).length;
      const isActive = subHubActive === s.sk;

      return `
      <div style="background:var(--card);border:1px solid ${isActive ? s.color : s.color+'30'};border-radius:12px;overflow:hidden;transition:all .2s;${isActive?'box-shadow:0 0 20px '+s.color+'30':''}" id="subcard-${s.sk}">
        <!-- Card Header -->
        <div onclick="subHubClick('${s.sk}')" style="padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center">
          <!-- Icon + Ring -->
          <div style="position:relative;flex-shrink:0">
            <div style="width:52px;height:52px;border-radius:50%;background:${s.color}18;border:2px solid ${s.color}40;display:flex;align-items:center;justify-content:center;font-size:22px">${s.icon}</div>
            <div style="position:absolute;bottom:-2px;right:-2px;background:${pct>=80?'#10b981':pct>=50?'#f59e0b':'#334a6a'};border-radius:20px;padding:0px 5px;font-size:8px;font-weight:800;color:#000;font-family:'JetBrains Mono',monospace;border:1px solid var(--card)">${pct}%</div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:800;color:var(--white)">${s.label}</div>
            <div style="font-size:9px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.desc}</div>
            <div style="margin-top:6px;display:flex;align-items:center;gap:8px">
              <div style="flex:1;height:4px;background:var(--border);border-radius:2px">
                <div style="height:100%;width:${pct}%;background:${s.color};border-radius:2px;transition:width .5s"></div>
              </div>
              <span style="font-size:9px;color:var(--muted);white-space:nowrap">${done}/${tops.length}</span>
            </div>
          </div>
          <div style="font-size:14px;color:${isActive?s.color:'var(--border2)'}">▼</div>
        </div>

        <!-- Inline expanded tracker -->
        ${isActive ? `<div style="border-top:1px solid ${s.color}30;padding:0">
          <div style="display:flex;gap:6px;padding:10px 14px 8px;flex-wrap:wrap;border-bottom:1px solid var(--border)">

          </div>
          ${buildInlineTracker(s.sk)}
        </div>` : ''}
      </div>`;
    }).join('');

    return `
    <div style="margin-bottom:20px">
      <!-- Group header -->
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;background:${grp.color}0c;border-radius:10px;border:1px solid ${grp.color}25">

function buildInlineTracker(sk) {
  const sub = SUBS[sk];
  const tops = gTops(sub);
  const data = gT(sk);
  const col = sub.color || '#2563eb';
  const bc = sub.cols.filter(c => ['classYes','theoryYes','pyqYes','assignYes','bookYes'].includes(c));

  // Show max 20 topics inline, link to full for more
  const displayTops = tops.slice(0, 20);
  const remaining = tops.length - displayTops.length;

  function miniRows(tlist) {
    return tlist.map((t, i) => {
      const row = data[String(t.id)] || {};
      const done = bc.filter(c => row[c]).length;
      const complete = done === bc.length;
      const cells = sub.cols.map(c => {
        if (['classYes','theoryYes','pyqYes','assignYes','bookYes'].includes(c)) {
          const on = !!row[c];
          return `<td style="padding:3px 4px;text-align:center">
            <button class="chk${on?' on':''}" style="${on?'background:'+col+';border-color:'+col+';width:18px;height:18px':'width:18px;height:18px'}"
              onclick="togT('${sk}','${t.id}','${c}',this)">${on?'✓':''}</button>
          </td>`;
        }
        if (c === 'problematic') return `<td style="padding:3px 4px;text-align:center">
          <input class="ni" type="number" min="0" max="99" value="${row[c]||''}"
            onchange="setTv('${sk}','${t.id}','${c}',this.value)"
            style="width:32px;font-size:8px;color:${row[c]>0?'#ef4444':'var(--muted)'}"></td>`;
        if (['r01','r02','r03','r04','r05'].includes(c)) return `<td style="padding:3px 4px;text-align:center">
          <input class="di" type="date" value="${row[c]||''}"
            onchange="setTv('${sk}','${t.id}','${c}',this.value)"
            style="width:90px;font-size:8px;color:${row[c]?col:'var(--muted)'}"></td>`;
        return '<td></td>';
      }).join('');
      return `<tr style="opacity:${complete?.6:1};background:${i%2===0?'rgba(0,0,0,.1)':'transparent'}">
        <td style="padding:5px 8px;font-size:10px;font-weight:600;color:${complete?'var(--muted)':'var(--white)'};white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis">
          ${complete?`<span style="color:${col};margin-right:3px">✔</span>`:''}${t.name}
          ${t.hrs?`<span style="font-size:7px;color:var(--muted);margin-left:2px">(${t.hrs}h)</span>`:''}
        </td>
        ${cells}
      </tr>`;
    }).join('');
  }

  let tableHtml = '';
  if (sub.sections) {
    sub.sections.forEach(sec => {
      const secTops = sec.topics.slice(0, 8);
      tableHtml += `<div style="font-size:9px;font-weight:800;color:${sec.color};padding:4px 8px;background:${sec.color}10;margin-bottom:0;border-left:2px solid ${sec.color}">${sec.title}</div>
        <table style="width:100%;border-collapse:collapse;font-size:10px;margin-bottom:6px">
          <thead><tr>
            <th style="padding:4px 8px;text-align:left;color:var(--muted);font-size:8px;border-bottom:1px solid var(--border)">Topic</th>
            ${sub.cols.map(c=>`<th style="padding:4px 4px;text-align:center;color:var(--muted);font-size:8px;border-bottom:1px solid var(--border);white-space:nowrap">${c==='classYes'?'Cls':c==='theoryYes'?'Thy':c==='pyqYes'?'PYQ':c==='assignYes'?'Asn':c==='bookYes'?'Bk':c==='problematic'?'Pb':c.toUpperCase()}</th>`).join('')}
          </tr></thead>
          <tbody>${miniRows(secTops)}</tbody>
        </table>`;
    });
  } else {
    tableHtml = `<table style="width:100%;border-collapse:collapse;font-size:10px">
      <thead><tr>
        <th style="padding:4px 8px;text-align:left;color:var(--muted);font-size:8px;border-bottom:1px solid var(--border)">Topic</th>
        ${sub.cols.map(c=>`<th style="padding:4px 4px;text-align:center;color:var(--muted);font-size:8px;border-bottom:1px solid var(--border);white-space:nowrap">${c==='classYes'?'Cls':c==='theoryYes'?'Thy':c==='pyqYes'?'PYQ':c==='assignYes'?'Asn':c==='bookYes'?'Bk':c==='problematic'?'Pb':c.toUpperCase()}</th>`).join('')}
      </tr></thead>
      <tbody>${miniRows(displayTops)}</tbody>
    </table>`;
  }

  return `<div style="overflow-x:auto;max-height:50vh;overflow-y:auto;padding:10px 14px">
    ${tableHtml}
    ${remaining > 0 ? `<div style="text-align:center;padding:8px;font-size:10px;color:var(--muted)">+${remaining} more topics → <button onclick="goTo('${sk}')" style="background:none;border:none;color:${col};cursor:pointer;font-size:10px;font-weight:700;text-decoration:underline">Open Full Tracker</button></div>` : ''}
  </div>`;
}

// All topics across all subjects + special sections
function getAllTargetTopics(){
  const list = [];
  // All SUBS
  Object.entries(SUBS).forEach(([sk, sub])=>{
    const tops = gTops(sub);
    tops.forEach(t=>{
      list.push({
        id: sk+'_'+t.id,
        sk, tid: String(t.id),
        subject: sub.label,
        subIcon: sub.icon,
        subColor: sub.color,
        name: t.name,
        hrs: t.hrs||null,
        day: t.day||null,
        type: 'subject'
      });
    });
  });
  // Vocab sections
  ['Synonyms & Antonyms','One Word Substitutions','Idioms & Phrases'].forEach((vn,vi)=>{
    const vid = ['syno','ows','idk'][vi];
    for(let d=1;d<=150;d++){
      list.push({
        id:'vocab_'+vid+'_'+d,
        sk:'vocab', tid:vid+'_'+d,
        subject:'English Vocab — '+vn,
        subIcon:'📝', subColor:'#06b6d4',
        name:'Day-'+String(d).padStart(2,'0')+' — '+vn,
        type:'vocab', vocabType:vid, vocabDay:d
      });
    }
  });
  // Formula sections
  Object.entries(FORMULAS||{}).forEach(([fk,fv])=>{
    (fv.sections||[]).forEach(sec=>{
      list.push({
        id:'formula_'+fk+'_'+sec.name,
        sk:'formulas', tid:fk+'_'+sec.name,
        subject:'Formula — '+fv.label,
        subIcon:'🧮', subColor:fv.color,
        name:sec.name+' ('+sec.formulas.length+' formulas)',
        type:'formula'
      });
    });
  });
  // Important sections
  ['Tables','Squares 1-50','Cubes 1-30','Algebra Formulas','Trig Values','2D Mensuration','3D Mensuration','World Countries','India States'].forEach(nm=>{
    list.push({
      id:'imp_'+nm,
      sk:'important', tid:nm,
      subject:'Important Reference',
      subIcon:'⭐', subColor:'#f59e0b',
      name:nm,
      type:'important'
    });
  });
  return list;
}

// Target data storage
function getTD(){ return gl('s60target', {}); }
function setTD(d){ sl('s60target', d); }
function getTodayTargets(){
  const all = getTD();
  const t = all[tod()]||[];
  return t;
}
function saveTodayTargets(arr){
  const all = getTD();
  all[tod()] = arr;
  setTD(all);
}

// Check & move incomplete yesterday tasks to today
function processMidnightCarryover(){
  const all = getTD();
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yKey = yesterday.toISOString().slice(0,10);
  const yTasks = all[yKey]||[];
  const todayTasks = all[tod()]||[];
  const todayIds = new Set(todayTasks.map(t=>t.id));
  let carried = 0;
  yTasks.forEach(t=>{
    if(!t.done && !todayIds.has(t.id)){
      todayTasks.unshift({...t, carriedFrom: yKey, priority:'high', done:false});
      carried++;
    }
  });
  if(carried>0){
    all[tod()] = todayTasks;
    setTD(all);
    fl('🔄 '+carried+' incomplete tasks carried from yesterday!','#f59e0b');
  }
}

// Complete a target → auto fill R1-R7 dates for subject topics
function completeTarget(idx){
  const tasks = getTodayTargets();
  if(!tasks[idx]) return;
  tasks[idx].done = true;
  tasks[idx].completedAt = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  saveTodayTargets(tasks);

  const t = tasks[idx];
  if(t.type==='subject' && t.sk && SUBS[t.sk]){
    // Auto-fill revision dates
    const data = gT(t.sk);
    if(!data[t.tid]) data[t.tid]={};
    // Mark class as done
    data[t.tid].classYes = true;
    // Auto-fill R1-R7 dates using REV_INTERVALS
    const today2 = tod();
    Object.entries(REV_INTERVALS).forEach(([key,days])=>{
      if(!data[t.tid][key]){
        const d = new Date(today2);
        d.setDate(d.getDate()+days);
        data[t.tid][key] = d.toISOString().slice(0,10);
      }
    });
    sT(t.sk, data);
    // Log to revision planner
    logRevEntry(t.sk, t.tid, data[t.tid]);
    fl('✅ Target done! R1→R7 auto-scheduled 🎯','#10b981');
  } else {
    fl('✅ Target completed! 🔥','#10b981');
  }
  updProg();
  renderTarget();
}

function uncompleteTarget(idx){
  const tasks = getTodayTargets();
  if(!tasks[idx]) return;
  tasks[idx].done = false;
  tasks[idx].completedAt = null;
  saveTodayTargets(tasks);
  renderTarget();
}

function removeTarget(idx){
  const tasks = getTodayTargets();
  tasks.splice(idx,1);
  saveTodayTargets(tasks);
  renderTarget();
}

function moveUp(idx){
  const tasks = getTodayTargets();
  if(idx===0) return;
  [tasks[idx-1],tasks[idx]]=[tasks[idx],tasks[idx-1]];
  saveTodayTargets(tasks);
  renderTarget();
}

function addToTarget(topicId){
  const allTopics = getAllTargetTopics();
  const topic = allTopics.find(t=>t.id===topicId);
  if(!topic) return;
  const tasks = getTodayTargets();
  if(tasks.some(t=>t.id===topicId)){
    fl('Already in today\'s targets!','#f59e0b');
    return;
  }
  tasks.push({...topic, done:false, addedAt:tod(), priority:'normal'});
  saveTodayTargets(tasks);
  fl('🎯 '+topic.name.slice(0,30)+' added to targets!','#3b82f6');
  renderTarget();
}

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

function wrongNums(ans, range, count){
  const s=new Set();
  let att=0;
  while(s.size<count&&att<200){
    att++;
    const r=ans+Math.floor(Math.random()*range*2-range);
    if(r!==ans&&r>=0)s.add(r);
  }
  return [...s].slice(0,count);
}

let qz = {
  cat:'tables', level:'beginner', qIdx:0, score:0, total:10,
  answered:false, selected:null, correct:null,
  qs:[], history:[], showResult:false,
  autoNext: gl('s60autonext', false),
  _autoTimer: null,
  // Timer fields
  qStartTime: 0,       // when current question started (ms)
  testStartTime: 0,    // when full test started (ms)
  totalTestTime: 0,    // total test duration in seconds (set on result)
};

function getQBank(cat, level){
  const c = QUIZ_CATEGORIES[cat];
  if(!c) return [];
  return (c.levels && c.levels[level]) ? c.levels[level] : [];
}

function startQuiz(cat, level, count){
  level = level || qz.level || 'beginner';
  const bank = getQBank(cat, level);
  if(!bank.length){ fl('❗ No questions for this level yet!','#ef4444'); return; }
  const shuffled = [...bank].sort(()=>Math.random()-.5).slice(0, count||10);
  const qs = shuffled.map(q=>({...q, options: q.opts ? q.opts() : [q.a]}));
  const now = Date.now();
  qz = {
    cat, level, qIdx:0, score:0, total:qs.length,
    answered:false, selected:null, correct:null,
    qs, history:[], showResult:false,
    autoNext: qz.autoNext,
    _autoTimer: null,
    qStartTime: now,
    testStartTime: now,
    totalTestTime: 0,
  };
  renderImpQuiz();
  _startQTimer();
}

// ── Per-question live timer ──────────────────────────────────
let _qTimerInterval = null;
function _startQTimer(){
  clearInterval(_qTimerInterval);
  qz.qStartTime = Date.now();
  _qTimerInterval = setInterval(()=>{
    const el = document.getElementById('iq-live-timer');
    if(el){
      const secs = Math.floor((Date.now()-qz.qStartTime)/1000);
      el.textContent = secs+'s';
      el.style.color = secs>15?'#ef4444':secs>8?'#f59e0b':'#10b981';
    } else { clearInterval(_qTimerInterval); }
  }, 500);
}
function _stopQTimer(){
  clearInterval(_qTimerInterval);
  _qTimerInterval = null;
}

function answerQuiz(opt){
  if(qz.answered) return;
  const timeTaken = Math.round((Date.now()-qz.qStartTime)/1000);
  _stopQTimer();
  qz.answered = true;
  qz.selected = opt;
  qz.correct = String(qz.qs[qz.qIdx].a);
  const isRight = opt === qz.correct;
  if(isRight) qz.score++;
  qz.history.push({
    q: qz.qs[qz.qIdx].q,
    selected: opt,
    correct: qz.correct,
    right: isRight,
    timeSec: timeTaken,
  });
  renderImpQuiz();
  // Auto-next
  if(qz.autoNext){
    clearTimeout(qz._autoTimer);
    qz._autoTimer = setTimeout(()=>{
      if(qz.answered && !qz.showResult) nextQuiz();
    }, isRight ? 900 : 1800);
  }
}

function nextQuiz(){
  clearTimeout(qz._autoTimer);
  qz.qIdx++;
  qz.answered = false;
  qz.selected = null;
  qz.correct = null;
  if(qz.qIdx >= qz.total){
    _stopQTimer();
    qz.showResult = true;
    qz.totalTestTime = Math.round((Date.now()-qz.testStartTime)/1000);
  }
  renderImpQuiz();
  if(!qz.showResult) _startQTimer();
}

function _attachQuizHeaderListeners(){
  // Q-count buttons
  [10,20,30,40,50].forEach(n=>{
    const el=document.getElementById('qcnt-'+n);
    if(el) el.addEventListener('click',function(){startQuiz(qz.cat,qz.level,n);});
  });
  // Level buttons
  LEVELS.forEach(l=>{
    const el=document.getElementById('lvlbtn-'+l.key);
    if(el) el.addEventListener('click',function(){startQuiz(qz.cat,l.key,qz.total||10);});
  });
  // Category buttons
  Object.keys(QUIZ_CATEGORIES).forEach(k=>{
    const el=document.getElementById('catbtn-'+k);
    if(el) el.addEventListener('click',function(){qz.cat=k;renderImpQuiz();});
  });
  // Auto-next toggle
  const an=document.getElementById('autonext-btn');
  if(an) an.addEventListener('click',function(){
    qz.autoNext=!qz.autoNext;
    sl('s60autonext',qz.autoNext);
    renderImpQuiz();
  });
}

  // ── ACTIVE QUIZ ─────────────────────────────────────────────
  const q = qz.qs[qz.qIdx];
  const prog = Math.round((qz.qIdx/qz.total)*100);
  const lvl = LEVELS.find(l=>l.key===qz.level)||LEVELS[0];
  const catColor = QUIZ_CATEGORIES[qz.cat]?.color||'#3b82f6';

  const optHtml = (q.options||[q.a]).map((opt,oi)=>{
    const optStr = String(opt);
    const correctStr = String(q.a);
    let bg='var(--card2)', border='var(--border2)', color='var(--text)';
    if(qz.answered){
      if(optStr===correctStr){bg='rgba(16,185,129,.15)';border='#10b981';color='#10b981';}
      else if(optStr===qz.selected&&optStr!==correctStr){bg='rgba(239,68,68,.15)';border='#ef4444';color='#ef4444';}
    }
    const eid_iq='iqo2_'+qz.qIdx+'_'+oi;
    return `<button id="${eid_iq}" ${qz.answered?'disabled':''}\n      style="width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid ${border};background:${bg};color:${color};font-size:12px;cursor:${qz.answered?'default':'pointer'};font-weight:600;text-align:left;transition:all .15s;margin-bottom:7px;font-family:'Rajdhani',sans-serif">
      ${optStr}
    </button>`;
  }).join('');

  container.innerHTML = headerHTML + `
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:9px;padding:2px 8px;border-radius:20px;background:${lvl.color}22;color:${lvl.color};font-weight:800;border:1px solid ${lvl.color}44">${lvl.label}</span>
        <span style="font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace">${QUIZ_CATEGORIES[qz.cat].label}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:9px;color:var(--muted)">${qz.qIdx+1}/${qz.total}</span>
        <span style="font-size:10px;font-weight:800;color:#10b981">✓${qz.score}</span>
      </div>
    </div>
    <div style="height:5px;background:var(--border);border-radius:3px;margin-bottom:14px;overflow:hidden">
      <div style="height:100%;width:${prog}%;background:linear-gradient(90deg,${catColor},${lvl.color});border-radius:3px;transition:width .3s"></div>
    </div>
    <div style="font-size:17px;font-weight:800;color:var(--white);margin-bottom:14px;line-height:1.4;text-align:center;padding:12px;background:rgba(59,130,246,.06);border-radius:10px;border:1px solid var(--border)">
      ${q.q}
    </div>
    <div id="iq-opts-wrap">${optHtml}</div>
    <div id="iq-next-wrap">${qz.answered?`<button id="iq-next-btn" class="btn bp2" style="width:100%;margin-top:4px">
      ${qz.qIdx+1>=qz.total?'📊 See Results →':'Next Question →'}
    </button>`:''}</div>
    ${qz.answered&&qz.selected!==String(q.a)?`<div style="margin-top:8px;padding:8px 12px;background:rgba(16,185,129,.08);border-radius:8px;font-size:11px;color:#10b981;border:1px solid rgba(16,185,129,.2)">💡 Correct Answer: <strong>${q.a}</strong></div>`:''}
  </div>`;

  // Attach event listeners safely — no inline onclick with user data
  const curOpts = q.options||[q.a];
  curOpts.forEach((opt,oi)=>{
    const el=document.getElementById('iqo_'+qz.qIdx+'_'+oi)
           || document.getElementById('iqo2_'+qz.qIdx+'_'+oi);
    if(el) el.addEventListener('click',function(){answerQuiz(String(opt));});
  });
  const nb=document.getElementById('iq-next-btn');
  if(nb) nb.addEventListener('click',nextQuiz);
  _attachQuizHeaderListeners();
}

function buildImpQuiz(){
  setTimeout(()=>renderImpQuiz(),50);
  return `<div id="imp-quiz-container">
    <div style="text-align:center;padding:20px;color:var(--muted)">Loading quiz...</div>
  </div>`;
}
</script>
</body>
</html>
