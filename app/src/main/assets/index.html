<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>NEXUS — Study Tracker Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   NEXUS DESIGN SYSTEM — Study Tracker Pro  v3.0
   Premium · Advanced · Professional · High-Performance UI
══════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');

:root{
  /* ── DARK THEME (Default) ── */
  --bg:#02040a;
  --surface:#060c18;
  --card:#090f1f;
  --card2:#0c1428;
  --card3:#101830;
  --border:#0f1e38;
  --border2:#162440;
  --border3:#1e2f50;

  /* ── BRAND PALETTE ── */
  --accent:#3b82f6;
  --accent2:#6366f1;
  --accent3:#818cf8;
  --cyan:#06b6d4;
  --teal:#14b8a6;
  --emerald:#10b981;
  --amber:#f59e0b;
  --orange:#f97316;
  --red:#ef4444;
  --rose:#f43f5e;
  --green:#10b981;
  --lime:#84cc16;
  --purple:#8b5cf6;
  --violet:#7c3aed;
  --pink:#ec4899;
  --fuchsia:#d946ef;
  --gold:#fbbf24;

  /* ── TEXT ── */
  --text:#b8cef0;
  --text2:#8faad4;
  --muted:#2d4268;
  --white:#e8f0fe;
  --bright:#f0f6ff;

  /* ── LAYOUT ── */
  --hh:54px;
  --radius:14px;
  --radius-sm:9px;
  --radius-xs:6px;

  /* ── GLOWS ── */
  --glow-blue:0 0 24px rgba(59,130,246,.4),0 0 60px rgba(59,130,246,.12);
  --glow-green:0 0 24px rgba(16,185,129,.4),0 0 60px rgba(16,185,129,.12);
  --glow-amber:0 0 24px rgba(245,158,11,.4),0 0 60px rgba(245,158,11,.12);
  --glow-purple:0 0 24px rgba(139,92,246,.4),0 0 60px rgba(139,92,246,.12);
  --glow-cyan:0 0 24px rgba(6,182,212,.4),0 0 60px rgba(6,182,212,.12);

  /* ── SHADOWS ── */
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow:0 4px 20px rgba(0,0,0,.5);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
  --shadow-xl:0 16px 64px rgba(0,0,0,.7);

  /* ── GRADIENTS ── */
  --grad-blue:linear-gradient(135deg,#3b82f6,#6366f1);
  --grad-purple:linear-gradient(135deg,#8b5cf6,#ec4899);
  --grad-green:linear-gradient(135deg,#10b981,#06b6d4);
  --grad-amber:linear-gradient(135deg,#f59e0b,#f97316);
  --grad-header:linear-gradient(180deg,rgba(6,12,24,.98) 0%,rgba(6,12,24,.94) 100%);
}

[data-theme="light"]{
  --bg:#f0f4ff;
  --surface:#ffffff;
  --card:#f8faff;
  --card2:#eef2ff;
  --card3:#e8eeff;
  --border:#dde5ff;
  --border2:#c7d2fe;
  --border3:#a5b4fc;
  --text:#1e2d5a;
  --text2:#374270;
  --muted:#7c8db0;
  --white:#0f1e3a;
  --bright:#0a1530;
  --grad-header:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(248,250,255,.95) 100%);
}

/* ═══════════════════════════════════════════════════════════════
   NEXUS COMPONENT SYSTEM — Study Tracker Pro v3.0
   Premium · Clean · Professional · Mobile-First
═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Rajdhani','Noto Sans Devanagari','Segoe UI',sans-serif;
  min-height:100vh;overflow-x:hidden;
}

/* Layered ambient background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 50% at 0% 0%,rgba(59,130,246,.07) 0%,transparent 55%),
    radial-gradient(ellipse 60% 60% at 100% 100%,rgba(139,92,246,.07) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(16,185,129,.03) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 10%,rgba(6,182,212,.04) 0%,transparent 50%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(59,130,246,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,.012) 1px,transparent 1px);
  background-size:40px 40px;
}

/* ── SCROLLBAR ─────────────────────────── */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:10px;}

/* ══════════════════════════════════════════
   HEADER — Glassmorphism Pro
══════════════════════════════════════════ */
header{
  position:sticky;top:0;z-index:300;height:var(--hh);
  background:var(--grad-header);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  box-shadow:0 1px 0 var(--border),var(--shadow);
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--accent) 30%,var(--accent2) 70%,transparent 100%);
  opacity:.3;
}

/* Logo pills */
.bp{border-radius:6px;padding:2px 9px;font-size:8px;font-weight:900;letter-spacing:2px;color:#fff;font-family:'JetBrains Mono',monospace;}
.bpa{background:var(--grad-blue);box-shadow:var(--glow-blue);}
.bpb{background:var(--grad-purple);}

/* Nav pills */
.hm{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap;overflow:hidden;}
.pil{
  font-size:12px;padding:4px 7px;border-radius:7px;
  background:transparent;border:1px solid transparent;
  color:var(--muted);cursor:pointer;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;line-height:1;font-family:'Rajdhani',sans-serif;font-weight:700;
}
.pil:hover{
  border-color:var(--border2);color:var(--text2);
  background:rgba(59,130,246,.06);transform:translateY(-1px);
}
.pil.active{
  background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(99,102,241,.15));
  border-color:rgba(59,130,246,.5);color:#93c5fd;
  box-shadow:0 2px 12px rgba(59,130,246,.25),inset 0 1px 0 rgba(255,255,255,.06);
  transform:translateY(-1px);
}

/* Icon buttons */
.ib{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);padding:5px 9px;cursor:pointer;font-size:14px;
  transition:all .18s;flex-shrink:0;
}
.ib:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08);transform:translateY(-1px);}
.ib.active{border-color:rgba(59,130,246,.5);color:var(--accent);background:rgba(59,130,246,.1);}

/* Status badges */
.eb{font-size:7px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:20px;border:1px solid var(--green);color:var(--green);background:rgba(16,185,129,.08);letter-spacing:.5px;font-weight:800;}
.eb.w{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.08);}
.eb.d{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.08);}

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.lay{display:flex;min-height:calc(100vh - var(--hh));}

aside{
  width:0;
  background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%);
  border-right:1px solid var(--border);
  overflow:hidden;transition:width .28s cubic-bezier(.4,0,.2,1);flex-shrink:0;
  position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto;
}
aside.op{width:214px;}
aside::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--accent),transparent);
  opacity:.15;
}

.sg{padding:10px 8px 4px;}
.sgl{
  font-size:7px;color:var(--muted);letter-spacing:2.5px;
  padding:0 10px;margin-bottom:5px;
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;
  opacity:.7;
}
.sb{
  width:100%;text-align:left;padding:8px 10px;background:transparent;
  border:1px solid transparent;border-radius:10px;cursor:pointer;margin-bottom:2px;
  color:var(--muted);font-size:11px;display:flex;align-items:center;gap:8px;
  font-family:'Rajdhani',sans-serif;font-weight:600;transition:all .18s;
}
.sb:hover{background:rgba(59,130,246,.07);color:var(--white);border-color:var(--border);}
.sb.active{
  background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(99,102,241,.12));
  border-color:rgba(59,130,246,.45);color:#93c5fd;font-weight:700;
  box-shadow:inset 0 0 20px rgba(59,130,246,.06),0 2px 8px rgba(59,130,246,.1);
}
.sb.active::before{
  content:'';width:2px;height:14px;border-radius:1px;
  background:var(--accent);box-shadow:0 0 6px var(--accent);flex-shrink:0;
}
.sp{font-size:7px;font-family:'JetBrains Mono',monospace;margin-left:auto;flex-shrink:0;opacity:.7;}

main{flex:1;padding:12px;min-width:0;overflow-x:hidden;position:relative;z-index:1;}

/* ══════════════════════════════════════════
   PANELS
══════════════════════════════════════════ */
.pn{display:none;}
.pn.active{display:block;animation:panelIn .22s cubic-bezier(.4,0,.2,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

/* ══════════════════════════════════════════
   CARDS
══════════════════════════════════════════ */
.pc{
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border:1px solid var(--border);
  border-radius:16px;padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,border-color .2s;
}
.pc::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 50%,transparent 100%);
}
.pc:hover{box-shadow:var(--shadow);}
.card-glow-blue{box-shadow:0 4px 24px rgba(59,130,246,.12);border-color:rgba(59,130,246,.22);}
.card-glow-green{box-shadow:0 4px 24px rgba(16,185,129,.12);border-color:rgba(16,185,129,.22);}
.card-glow-amber{box-shadow:0 4px 24px rgba(245,158,11,.12);border-color:rgba(245,158,11,.22);}
.card-glow-purple{box-shadow:0 4px 24px rgba(139,92,246,.12);border-color:rgba(139,92,246,.22);}
.card-glow-cyan{box-shadow:0 4px 24px rgba(6,182,212,.12);border-color:rgba(6,182,212,.22);}

/* ══════════════════════════════════════════
   SECTION LABELS
══════════════════════════════════════════ */
.sl{
  font-size:8px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;color:var(--muted);
}
.sl::before{
  content:'';display:inline-block;width:3px;height:14px;border-radius:2px;
  background:currentColor;box-shadow:0 0 8px currentColor;flex-shrink:0;
}
.sl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.15;}

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn{
  padding:8px 18px;border-radius:9px;border:none;cursor:pointer;
  font-weight:700;font-size:11px;letter-spacing:.8px;
  font-family:'Rajdhani',sans-serif;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 60%);
  pointer-events:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.btn:active{transform:translateY(0) scale(.97);}
.bp2{background:var(--grad-blue);color:#fff;box-shadow:var(--glow-blue);}
.bp2:hover{box-shadow:var(--glow-blue),var(--shadow);}
.bd{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;}
.bg2{background:rgba(255,255,255,.03)!important;border:1px solid var(--border2)!important;color:var(--text)!important;}
.bg2:hover{background:rgba(255,255,255,.07)!important;}
.bs{padding:4px 12px;font-size:9px;border-radius:7px;}
.bx{padding:2px 7px;font-size:8px;border-radius:5px;}

/* ══════════════════════════════════════════
   INPUTS
══════════════════════════════════════════ */
.inp{
  background:var(--card2);border:1px solid var(--border2);border-radius:9px;
  color:var(--text);padding:8px 12px;font-size:12px;outline:none;
  font-family:'Rajdhani',sans-serif;transition:all .2s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12),0 2px 8px rgba(59,130,246,.1);}
select.inp{cursor:pointer;}
textarea.inp{resize:vertical;}

/* ══════════════════════════════════════════
   TABLE
══════════════════════════════════════════ */
table{width:100%;border-collapse:collapse;font-size:11px;}
thead{position:sticky;top:0;z-index:2;}
th{
  padding:7px 9px;text-align:left;color:var(--muted);
  font-size:7.5px;letter-spacing:1.5px;border-bottom:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;white-space:nowrap;
  background:var(--card2);text-transform:uppercase;font-weight:800;
}
th:first-child{border-radius:8px 0 0 0;}
th:last-child{border-radius:0 8px 0 0;}
td{padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background .1s;}
tr:hover td{background:rgba(59,130,246,.04);}
tr:last-child td{border-bottom:none;}

/* ══════════════════════════════════════════
   CHECKBOXES & INPUTS
══════════════════════════════════════════ */
.chk{
  width:20px;height:20px;border-radius:5px;
  border:1.5px solid var(--border2);background:transparent;
  color:#fff;font-size:10px;cursor:pointer;
  transition:all .15s;display:inline-flex;align-items:center;justify-content:center;
}
.chk.on{box-shadow:var(--glow-green);}
.ni{width:36px;background:var(--card2);border:1px solid var(--border2);border-radius:5px;color:var(--text);padding:2px 3px;text-align:center;font-size:9px;font-family:'JetBrains Mono',monospace;}
.di{background:var(--card2);border:1px solid var(--border2);border-radius:5px;color:var(--text);padding:2px 4px;font-size:8px;width:98px;}

/* ══════════════════════════════════════════
   STAT CARDS
══════════════════════════════════════════ */
.sg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:14px;}
.sc{
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border-radius:13px;padding:14px 13px;
  position:relative;overflow:hidden;border:1px solid var(--border);
  transition:all .2s;cursor:default;
}
.sc:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);}
.sn{font-size:24px;font-weight:900;font-family:'JetBrains Mono',monospace;line-height:1.1;}
.sl2{font-size:7px;color:var(--muted);letter-spacing:2px;margin-top:5px;text-transform:uppercase;font-weight:800;}
.sb2{position:absolute;bottom:0;left:0;right:0;height:2px;}

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap;}
.tb{
  padding:5px 13px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:9px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.5px;transition:all .18s;
}
.tb:hover{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.06);}
.tb.active{background:var(--grad-blue);border-color:transparent;color:#fff;box-shadow:var(--glow-blue);}
.tc{display:none;}
.tc.active{display:block;animation:panelIn .2s ease;}

/* ══════════════════════════════════════════
   FLASH TOAST
══════════════════════════════════════════ */
#fl{
  position:fixed;top:66px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  padding:10px 22px;border-radius:12px;font-weight:800;font-size:12px;
  z-index:9999;letter-spacing:.5px;pointer-events:none;
  font-family:'Rajdhani',sans-serif;opacity:0;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;
  box-shadow:var(--shadow-lg);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}
#fl.sh{transform:translateX(-50%) translateY(0);opacity:1;}

/* ══════════════════════════════════════════
   180 DAY GRID
══════════════════════════════════════════ */
.dg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;}
.dc{
  aspect-ratio:1;border-radius:6px;border:1px solid var(--border2);
  background:var(--card2);display:flex;align-items:center;justify-content:center;
  font-size:7.5px;font-family:'JetBrains Mono',monospace;cursor:pointer;
  transition:all .15s;font-weight:800;
}
.dc:hover{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 8px rgba(59,130,246,.3);}
.dc.dn{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981;color:#000;box-shadow:0 2px 10px rgba(16,185,129,.45);}
.dc.sk{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#ef4444;color:#fff;}
.dc.td{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(6,182,212,.5);animation:pulse .8s ease infinite alternate;}
@keyframes pulse{from{box-shadow:0 0 4px rgba(6,182,212,.3)}to{box-shadow:0 0 14px rgba(6,182,212,.8)}}

/* ══════════════════════════════════════════
   ANKI FLASHCARDS
══════════════════════════════════════════ */
.akc{
  background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);
  border:1px solid var(--border);border-radius:18px;padding:28px 22px;
  text-align:center;min-height:170px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  transition:all .22s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.akc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);}
.akc:hover{border-color:rgba(59,130,246,.4);box-shadow:var(--glow-blue);transform:translateY(-3px);}
.akq{font-size:18px;font-weight:700;color:var(--bright);margin-bottom:12px;line-height:1.5;}
.aka{font-size:14px;color:var(--cyan);margin-top:14px;display:none;font-weight:700;}

/* ══════════════════════════════════════════
   MODALS
══════════════════════════════════════════ */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:5000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.mo.op{display:flex;}
.mb{
  background:linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--border2);border-radius:20px;
  padding:24px;max-width:500px;width:92%;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-xl);
  animation:modalIn .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.mt{font-size:14px;font-weight:800;color:var(--bright);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.mc{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--red);cursor:pointer;font-size:16px;border-radius:6px;padding:2px 8px;transition:all .15s;}
.mc:hover{background:rgba(239,68,68,.25);}

/* ══════════════════════════════════════════
   PROGRESS RINGS
══════════════════════════════════════════ */
.ring-glow{filter:drop-shadow(0 0 8px currentColor);}

/* ══════════════════════════════════════════
   PIE CHART
══════════════════════════════════════════ */
.pwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;}

// ═══════ SVG HELPERS ═══════
function ring(pct,sz=58,st=6,col){
  const c=col||pc(pct),r=(sz-st*2)/2,ci=2*Math.PI*r,off=ci-(pct/100)*ci;
  const trackCol=pct>0?c+'22':'var(--border)';
  return `<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg);display:block;flex-shrink:0">
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${trackCol}" stroke-width="${st}"/>
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${st}"
      stroke-dasharray="${ci}" stroke-dashoffset="${off}" stroke-linecap="round"
      style="filter:drop-shadow(0 0 ${sz*.08}px ${c});transition:stroke-dashoffset .6s ease"/>
    <text x="${sz/2}" y="${sz/2}" text-anchor="middle" dominant-baseline="middle"
      fill="${c}" font-size="${sz*.17}" font-weight="800" font-family="monospace"
      style="transform:rotate(90deg) translate(0,-${sz}px)">${pct}%</text>
  </svg>`;
}
function pie(data,sz=130){
  let tot=data.reduce((a,d)=>a+d.v,0);
  if(!tot)return'<div style="color:var(--muted);font-size:11px">No data</div>';
  let ang=-90,paths='';
  data.forEach(d=>{
    const p=d.v/tot,a=p*360,ea=ang+a,r=sz/2-5,cx=sz/2,cy=sz/2;
    const s1=Math.sin(ang*Math.PI/180),c1=Math.cos(ang*Math.PI/180);
    const s2=Math.sin(ea*Math.PI/180),c2=Math.cos(ea*Math.PI/180);
    paths+=`<path d="M${cx},${cy} L${cx+r*c1},${cy+r*s1} A${r},${r} 0 ${a>180?1:0},1 ${cx+r*c2},${cy+r*s2} Z" fill="${d.col}" opacity=".88"/>`;
    ang=ea;
  });
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${paths}</svg>`;
}

function resetSubject(sk){
  var sub=SUBS[sk];
  if(!sub)return;
  if(!confirm('⚠️ "'+sub.label+'" ka POORA data delete hoga?\n\n• Sab topics progress\n• Start / Complete dates\n• R1 to R7 dates\n• Custom topics\n\n❌ Undo nahi hoga!'))return;

  // 1. Delete from localStorage
  try{ localStorage.removeItem('s60t_'+sk); }catch(e){}
  try{ localStorage.removeItem('s60cust_'+sk); }catch(e){}

  // 2. Overwrite with empty data (force clean state)
  try{ sl('s60t_'+sk,{}); }catch(e){}
  try{ sl('s60cust_'+sk,[]); }catch(e){}

  // 3. Remove from revision log
  try{
    var rl=gl('s60revlog',[]);
    var filtered=rl.filter(function(e){return e.sk!==sk;});
    sl('s60revlog',filtered);
  }catch(e){}

  // 4. Update progress and re-render subject
  fl('✅ '+sub.label+' reset ho gaya!');
  try{ updProg(); }catch(e){}
  try{ renderSub(sk); }catch(e){}
  try{ renderOverview(); }catch(e){}
}

// Revision intervals: R1=1d, R2=3d, R3=7d, R4=15d, R5=31d
const REV_INTERVALS = {r01:1, r02:3, r03:7, r04:15, r05:31, r06:63, r07:127};

function autoFillRevDates(sk, tid, data){
  const row = data[String(tid)]||{};
  // ── ONLY fill R1-R7 if completeDate is set ──
  // R dates should start ONLY after topic is fully complete
  if(!row['completeDate']) return; // NO completeDate = no R schedule
  const baseDate = row['completeDate'];
  Object.entries(REV_INTERVALS).forEach(([key, days])=>{
    if(!row[key]){ // only auto-fill empty slots
      const d = new Date(baseDate);
      d.setDate(d.getDate() + days);
      row[key] = d.toISOString().slice(0,10);
    }
  });
  data[String(tid)] = row;
  logRevEntry(sk, tid, row);
}

// Called when completeDate is filled — auto-calculate R1–R7 from that date
function onCompleteDateChange(sk, tid, val){
  const d = gT(sk);
  const row = d[String(tid)]||{};

  if(!val){
    // Cleared completeDate — remove all R dates too
    row['completeDate'] = '';
    Object.keys(REV_INTERVALS).forEach(key=>{ row[key]=null; });
    d[String(tid)] = row;
    sT(sk, d);
    fl('📅 Complete date cleared — R1–R7 removed');
    // Clear date inputs in DOM
    ['r01','r02','r03','r04','r05','r06','r07'].forEach(r=>{
      const el = document.querySelector('[data-rev-inp="'+sk+'-'+tid+'-'+r+'"]');
      if(el) el.value = '';
    });
    return;
  }

  row['completeDate'] = val;
  // Reset all existing R dates so they recalculate fresh from new completeDate
  Object.keys(REV_INTERVALS).forEach(key=>{ row[key]=null; });
  d[String(tid)] = row;
  // Now fill R1–R7 from completeDate
  autoFillRevDates(sk, tid, d);
  sT(sk, d);

  // Update R date inputs in DOM instantly
  const revKeys = ['r01','r02','r03','r04','r05','r06','r07'];
  const intervals = Object.values(REV_INTERVALS);
  revKeys.forEach((r,i)=>{
    const el = document.querySelector('[data-rev-inp="'+sk+'-'+tid+'-'+r+'"]');
    if(el && d[String(tid)][r]) el.value = d[String(tid)][r];
  });

  logRevEntry(sk, tid, d[String(tid)]);

  // Show what was scheduled
  const r1 = d[String(tid)]['r01']||'';
  const r7 = d[String(tid)]['r07']||'';
  fl('✅ R1–R7 auto-scheduled! R1: '+r1+' → R7: '+r7);

  // Re-render revision panel if open
  const rp = document.getElementById('panel-revision');
  if(rp && rp.classList.contains('active')) renderRevision();
}

function logRevEntry(sk, tid, row){
  const sub = SUBS[sk];
  if(!sub) return;
  const tops = gTops(sub);
  const topic = tops.find(t=>String(t.id)===String(tid));
  if(!topic) return;
  let revLog = gl('s60revlog', []);
  // Remove existing entry for this topic+subject
  revLog = revLog.filter(e=>!(e.sk===sk && String(e.tid)===String(tid)));
  const today = tod();
  revLog.push({
    sk, tid:String(tid),
    subLabel: sub.label, subIcon: sub.icon, subColor: sub.color,
    topicName: topic.name,
    addedOn: today,
    startDate: row.startDate||null,
    completeDate: row.completeDate||null,
    r01:row.r01||null, r02:row.r02||null, r03:row.r03||null,
    r04:row.r04||null, r05:row.r05||null, r06:row.r06||null, r07:row.r07||null,
  });
  sl('s60revlog', revLog);
}

function togT(sk,tid,col,btn){
  const d=gT(sk); const row=d[String(tid)]||{}; const nv=!row[col];
  d[String(tid)]={...row,[col]:nv};
  // Auto-fill startDate when first checkbox checked (Class/Theory/PYQ)
  // R1-R7 dates are filled ONLY when completeDate is set — NOT from checkboxes
  if(nv && ['classYes','theoryYes','pyqYes','assignYes','bookYes'].includes(col)){
    const row2 = d[String(tid)]||{};
    if(!row2.startDate){
      row2.startDate = tod();
      d[String(tid)] = row2;
      sT(sk, d);
      // Show hint to user
      fl('📘 Start date recorded! Set Complete Date to schedule R1–R7');
    }
  }
  sT(sk,d);
  const color=SUBS[sk].color||'#2563eb';
  if(nv){btn.classList.add('on');btn.textContent='✓';btn.style.background=color;btn.style.borderColor=color;}
  else{btn.classList.remove('on');btn.textContent='';btn.style.background='';btn.style.borderColor='';}
  updProg();
}

function exportPDF(){
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF();
    doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(37,99,235);
    doc.text('STUDY TRACKER PRO',14,18);
    doc.setFontSize(9);doc.setTextColor(100,120,140);
    doc.text('Study Report — '+new Date().toLocaleDateString('en-IN')+' | Student: '+(SES.n||'—'),14,25);
    let y=34;doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(0);
    doc.text('Subject Progress',14,y);y+=7;
    SKS.forEach(k=>{
      const sub=SUBS[k],d=gT(k),tops=gTops(sub),pct=cPct(d,tops,sub.cols);
      const done=tops.filter(t=>sub.cols.filter(c=>BC.includes(c)).every(c=>(d[String(t.id)]||{})[c])).length;
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.text(`${sub.label} (${sub.part}): ${done}/${tops.length} — ${pct}%`,14,y);
      doc.setFillColor(220,220,220);doc.rect(112,y-4,76,3,'F');
      doc.setFillColor(37,99,235);doc.rect(112,y-4,76*pct/100,3,'F');
      y+=7;if(y>270){doc.addPage();y=18;}
    });
    y+=4;doc.setFontSize(11);doc.setFont('helvetica','bold');
    doc.text('Study Tracker Stats',14,y);y+=7;doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text(`Topics: ${ZTH.length} | 5★: ${ZTH.filter(t=>t.conf===5).length} | Weak: ${ZTH.filter(t=>t.conf<=2).length}`,14,y);y+=6;
    doc.text(`ANKI Cards: ${AK.length} | Days Done: ${Object.values(DT).filter(v=>v==='done').length}/180`,14,y);y+=10;
    doc.setFontSize(8);doc.setTextColor(120);
    doc.text('"जहाँ सफलता एक जिद है।" — Study Tracker',14,y);
    doc.save('study-report-'+tod()+'.pdf');fl('✔ PDF downloaded!');
  }catch(e){fl('PDF error','#ef4444');}
}

function clearAll(){
  if(!confirm('⚠️ RESET ALL DATA?\n\nYe sab delete ho jayega:\n• Sabhi subject ka progress\n• R1-R7 schedule\n• Anki cards & Vocab\n• Daily logs & Settings\n\n❌ UNDO NAHI HOGA!')) return;

  // ── STEP 1: Wipe localStorage completely ──
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k)keys.push(k);
    }
    for(var j=0;j<keys.length;j++){
      localStorage.removeItem(keys[j]);
    }
    localStorage.clear();
  }catch(e){}

  // ── STEP 2: Reset ALL in-memory global variables ──
  try{
    ZTH=[];
    ERRS=[];
    AK=[];
    DT={};
    userFormulas=[];
    SKS.forEach(function(k){
      // Clear each subject's data from memory by overwriting with empty
      sl('s60t_'+k,{});
      sl('s60cust_'+k,[]);
    });
  }catch(e){}

  // ── STEP 3: Reset all panels to blank ──
  try{
    var panels=document.querySelectorAll('.pn');
    for(var p=0;p<panels.length;p++){ panels[p].innerHTML=''; }
  }catch(e){}

  // ── STEP 4: Show success and re-init app ──
  fl('✅ Sab reset ho gaya! App fresh ho rahi hai...');

  setTimeout(function(){
    try{
      // Re-initialize the entire app fresh
      ZTH=gl('s60z',[]);
      ERRS=gl('s60e',[]);
      AK=gl('s60ak',[]);
      DT=gl('s60d',{});
      userFormulas=gl('s60uf',[]);
      buildNav();
      updProg();
      renderOverview();
      // Navigate to overview
      goTo('overview');
    }catch(e){}
  }, 400);
}

      chHtml += `<div style="border:1px solid ${isOpen?curr.color+'50':'var(--border)'};border-radius:9px;margin-bottom:8px;overflow:hidden;transition:all .2s">

          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:9px;color:var(--muted)">${ch.topics.length} topics</span>
            <span style="color:${curr.color};font-size:14px">${isOpen?'▲':'▼'}</span>

        </div>
        ${isOpen?`<div style="border-top:1px solid ${curr.color}30">${topHtml}</div>`:''}

    });
    panels += `<div id="cpanel-${sk}" class="tc" style="display:${sk===skeys[0]?'block':'none'}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">

        </div>
      </div>
      ${chHtml}
    </div>`;
  });

  p.innerHTML = `<div class="pc">
    <div class="sl" style="color:var(--purple)">📋 Curriculum Map — Subject → Chapter → Topic → Question Type</div>
    <div class="tabs">${stabs}</div>
    ${panels}
  </div>`;
}

function togCh(id){
  currOpen[id] = !currOpen[id];
  const p = document.querySelector('.pn.active');
  if(p && p.id==='panel-curriculum') renderCurriculum();
  // Restore active tab
  const tabs = document.querySelectorAll('#panel-curriculum .tb');
  tabs.forEach(t=>{
    if(t.classList.contains('active')){
      const sk = t.id.replace('ctab-','');
      document.querySelectorAll('[id^="cpanel-"]').forEach(p=>p.style.display='none');
      const cp = document.getElementById('cpanel-'+sk);
      if(cp) cp.style.display='block';
    }
  });
}

function shCurTab(sk){
  document.querySelectorAll('[id^="cpanel-"]').forEach(p=>p.style.display='none');
  document.querySelectorAll('#panel-curriculum .tb').forEach(t=>t.classList.remove('active'));
  const cp = document.getElementById('cpanel-'+sk);
  if(cp) cp.style.display='block';
  const tb = document.getElementById('ctab-'+sk);
  if(tb) tb.classList.add('active');
}

let FT={running:false,left:25*60,total:25*60,phase:'focus',sessions:0,interval:null,subject:'',topic:''};
let FLOG=gl('s60fl',[]);function sFLOG(){sl('s60fl',FLOG);}

  const pBtns=PRESETS.map((pr,i)=>`<button onclick="setFP(${i})" style="padding:3px 10px;border-radius:6px;border:1px solid ${curP===i?pr.c:'var(--border)'};background:${curP===i?pr.c+'18':'transparent'};color:${curP===i?pr.c:'var(--muted)'};font-size:9px;font-family:'JetBrains Mono',monospace;cursor:pointer">${pr.l}</button>`).join('');

  const logRows=FLOG.slice(0,15).map((l,i)=>`<tr style="background:${i%2===0?'var(--surface)':'transparent'}">
    <td style="font-size:8px;color:var(--muted);font-family:'JetBrains Mono',monospace">${l.date}</td>

    <td style="font-size:9px;color:var(--amber);font-family:'JetBrains Mono',monospace">${l.mins}m</td>
    <td><span style="padding:1px 5px;border-radius:3px;font-size:7px;background:${l.phase==='break'?'#10b98118':'#2563eb18'};color:${l.phase==='break'?'#10b981':'#2563eb'}">${l.phase}</span></td>
  </tr>`).join('');

  const sOpts=Object.values(SUBS).map(s=>`<option>${s.label}</option>`).join('');

  p.innerHTML=`
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="pc">
      <div class="sl" style="color:${col}">⏱ Focus Timer — Pomodoro</div>
      <div style="text-align:center;margin-bottom:12px">
        <span style="padding:3px 12px;border-radius:20px;font-size:9px;font-family:'JetBrains Mono',monospace;background:${FT.phase==='break'?'#10b98118':'#2563eb18'};color:${FT.phase==='break'?'#10b981':'#2563eb'};border:1px solid ${FT.phase==='break'?'#10b98140':'#2563eb40'}">${FT.phase==='break'?'☕ BREAK':'🔥 FOCUS'}</span>
      </div>
      <div style="display:flex;justify-content:center;margin-bottom:16px;position:relative">
        <svg width="${SZ}" height="${SZ}" style="transform:rotate(-90deg)">

function setFP(i){
  if(FT.running)return;
  curP=i;
  const s=PRESETS[i].s;
  if(s!==null){FT.left=s;FT.total=s;}
  renderFocus();
}
function fToggle(){
  if(FT.running){clearInterval(FT.interval);FT.running=false;}
  else{
    if(FT.left<=0)fReset();
    FT.interval=setInterval(()=>{
      FT.left--;
      if(FT.left<=0){clearInterval(FT.interval);FT.running=false;fComplete();}
      else fUpdateDisplay();
    },1000);
    FT.running=true;
  }
  renderFocus();
}
function fReset(){
  clearInterval(FT.interval);FT.running=false;
  if(curP===4){FT.left=custM*60;FT.total=custM*60;}
  else{FT.left=PRESETS[curP].s||25*60;FT.total=FT.left;}
  renderFocus();
}
function fComplete(){
  const mins=Math.round(FT.total/60);
  const subEl=document.getElementById('fsubj'),topEl=document.getElementById('ftopic');
  FLOG.unshift({date:tod(),time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),subject:FT.subject||(subEl?subEl.options[subEl.selectedIndex]?.text:'')  ||'—',topic:FT.topic||(topEl?topEl.value:'') ||'—',mins,phase:FT.phase});
  FLOG=FLOG.slice(0,100);sFLOG();
  if(FT.phase==='focus'){FT.sessions++;FT.phase='break';FT.left=5*60;FT.total=5*60;}
  else{FT.phase='focus';if(curP===4){FT.left=custM*60;FT.total=custM*60;}else{FT.left=PRESETS[curP].s||25*60;FT.total=FT.left;}}
  fl('Session complete! 🎉');renderFocus();
}
function fUpdateDisplay(){
  const m=String(Math.floor(FT.left/60)).padStart(2,'0'),s=String(FT.left%60).padStart(2,'0');
  const d=document.querySelector('#panel-focus .pn.active, #panel-focus');
  const td=document.getElementById('panel-focus');if(!td||!td.classList.contains('active'))return;
  const pct=FT.total>0?Math.round((FT.total-FT.left)/FT.total*100):0;
  const col=FT.phase==='break'?'#10b981':(PRESETS[curP]?.c||'#2563eb');
  const SZ=180,ST=11,R=(SZ-ST*2)/2,CI=2*Math.PI*R,OFF=CI-(pct/100)*CI;
  // Update SVG circle
  const circles=td.querySelectorAll('svg circle');
  if(circles[1]){circles[1].setAttribute('stroke-dashoffset',OFF);circles[1].setAttribute('stroke',col);}
  // Update time display
  const timeEl=td.querySelector('[style*="38px"]');if(timeEl)timeEl.textContent=m+':'+s;
  const pctEl=td.querySelector('[style*="elapsed"]');if(pctEl)pctEl.textContent=pct+'% elapsed';
  const btnEl=document.getElementById('fstart');if(btnEl)btnEl.textContent=FT.running?'⏸ PAUSE':'▶ RESUME';
}

let fvSubject = 'maths', fvSection = null;
let userFormulas = gl('s60uf', []);
function sUF(){sl('s60uf', userFormulas);}

function renderFormulas(){
  const p = document.getElementById('panel-formulas');
  const subKeys = Object.keys(FORMULAS);
  const stabs = subKeys.map(k=>`<button class="tb${fvSubject===k?' active':''}" onclick="setFVSub('${k}')">${FORMULAS[k].icon} ${FORMULAS[k].label}</button>`).join('');
  const curr = FORMULAS[fvSubject];

  const sections = curr.sections.map((sec,si)=>{
    const isOpen = fvSection===si||fvSection===null&&si===0;
    const cards = sec.formulas.map((f,fi)=>`
      <div style="background:var(--card);border:1px solid ${f.color}30;border-radius:10px;padding:12px;position:relative;overflow:hidden">
        <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:${f.color}"></div>
        <div style="padding-left:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:6px">
            <div style="font-size:10px;font-weight:800;color:${f.color}">${f.name}</div>
            <button onclick="reviseOneFormula('${fi}','${si}','${fvSubject}')"
              style="padding:2px 8px;border-radius:6px;border:1px solid ${f.color}55;background:${f.color}18;color:${f.color};font-size:8px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0">
              🔁 Revise
            </button>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--white);background:${f.color}10;border-radius:6px;padding:7px 10px;margin-bottom:5px;text-align:center;line-height:1.5">${f.formula}</div>
          <div style="font-size:9px;color:var(--muted)">Ex: ${f.example}</div>
        </div>
      </div>`).join('');
    return `<div style="margin-bottom:10px;border:1px solid ${isOpen?sec.color+'50':'var(--border)'};border-radius:10px;overflow:hidden">
      <div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:${isOpen?sec.color+'12':'transparent'}">
        <div onclick="fvToggleSec(${si})" style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1">
          <span style="font-size:16px">${sec.icon}</span>
          <span style="font-size:12px;font-weight:700;color:${isOpen?sec.color:'var(--white)'}">${sec.name}</span>
          <span style="font-size:9px;color:var(--muted)">${sec.formulas.length} formulas</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button onclick="reviseSection(${si},'${fvSubject}')"
            style="padding:3px 10px;border-radius:7px;border:1px solid ${sec.color}55;background:${sec.color}18;color:${sec.color};font-size:8px;font-weight:800;cursor:pointer;white-space:nowrap">
            🔁 Revise All
          </button>
          <span onclick="fvToggleSec(${si})" style="color:${sec.color};font-size:12px;cursor:pointer;padding:0 4px">${isOpen?'▲':'▼'}</span>
        </div>
      </div>
      ${isOpen?`<div style="padding:12px;border-top:1px solid ${sec.color}30;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px">${cards}</div>`:''}
    </div>`;
  }).join('');

  // User formulas
  const myCards = userFormulas.filter(f=>f.subject===fvSubject).map((f,i)=>`
    <div style="background:var(--card);border:1px solid ${curr.color}40;border-radius:10px;padding:12px;position:relative">
      <div style="font-size:10px;font-weight:800;color:${curr.color};margin-bottom:5px">${f.name} <span style="font-size:8px;color:var(--muted)">[${f.chapter}]</span></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--white);background:${curr.color}10;border-radius:5px;padding:6px 9px;margin-bottom:4px;text-align:center">${f.formula}</div>
      ${f.example?`<div style="font-size:9px;color:var(--muted)">Ex: ${f.example}</div>`:''}
      <button onclick="delUF(${userFormulas.indexOf(f)})" style="position:absolute;top:8px;right:8px;background:var(--red);border:none;color:#fff;border-radius:4px;padding:1px 5px;font-size:8px;cursor:pointer">✕</button>
    </div>`).join('');

  p.innerHTML=`
  <div class="pc">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div class="sl" style="color:${curr.color};margin:0">🧮 Formula Vault — ${curr.label}</div>
      <button class="btn bp2 bs" onclick="openFVAdd()">➕ Add Formula</button>
    </div>
    <div class="tabs">${stabs}</div>
    ${sections}
    ${myCards?`<div style="margin-top:14px"><div class="sl" style="color:var(--amber)">📌 My Formulas</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">${myCards}</div></div>`:''}
  </div>
  <div id="fv-add-form" style="display:none" class="pc">
    <div class="sl" style="color:var(--green)">➕ Add Your Formula</div>
    <div style="display:grid;gap:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div style="font-size:7px;color:var(--muted);margin-bottom:2px">SUBJECT</div>
          <select class="inp" id="uf-subj" style="width:100%">${subKeys.map(k=>`<option value="${k}">${FORMULAS[k].label}</option>`).join('')}</select></div>
        <div><div style="font-size:7px;color:var(--muted);margin-bottom:2px">CHAPTER/TOPIC</div>

// ── FORMULA REVISE QUIZ ────────────────────────────────────────
// Revise a single formula card → 4-option MCQ (guess the formula)
function reviseOneFormula(fi, si, subKey){
  fi = parseInt(fi); si = parseInt(si);
  const sec = FORMULAS[subKey].sections[si];
  const f = sec.formulas[fi];
  // Build a pool of wrong answers from same section + other sections
  const allFormulas = FORMULAS[subKey].sections.flatMap(s=>s.formulas);
  const wrong = allFormulas.filter(x=>x.formula!==f.formula)
    .sort(()=>Math.random()-.5).slice(0,3).map(x=>x.formula);
  const opts = shuffle([f.formula,...wrong]);
  // Build a 5-question mini-quiz cycling "what is [name]?" and "example uses?"
  const qs = [
    {q:`What is the formula for: "${f.name}"?`, a:f.formula, options:opts},
    {q:`"${f.formula}" — this is the formula for?`, a:f.name,
     options:shuffle([f.name,...allFormulas.filter(x=>x.name!==f.name).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.name)])},
    {q:`Fill in: ${f.formula.replace(/[^a-zA-Zα-ωΑ-Ω+\-×÷=²³⁴√πθ]/g,' ').trim()||f.name} — subject section?`,
     a:sec.name,
     options:shuffle([sec.name,...FORMULAS[subKey].sections.filter(s=>s.name!==sec.name).sort(()=>Math.random()-.5).slice(0,3).map(s=>s.name)])},
    {q:`Example: "${f.example}" — which formula?`, a:f.name,
     options:shuffle([f.name,...allFormulas.filter(x=>x.name!==f.name).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.name)])},
    {q:`"${f.name}" belongs to which section?`, a:sec.name,
     options:shuffle([sec.name,...FORMULAS[subKey].sections.filter(s=>s.name!==sec.name).sort(()=>Math.random()-.5).slice(0,3).map(s=>s.name)])},
  ];
  launchFormulaQuiz(qs, f.name, f.color);
}

// Revise all formulas in a section → MCQ quiz
function reviseSection(si, subKey){
  si = parseInt(si);
  const sec = FORMULAS[subKey].sections[si];
  const allFormulas = FORMULAS[subKey].sections.flatMap(s=>s.formulas);
  const qs = sec.formulas.flatMap(f=>[
    {q:`Formula for "${f.name}"?`, a:f.formula,
     options:shuffle([f.formula,...allFormulas.filter(x=>x.formula!==f.formula).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.formula)])},
    {q:`"${f.formula}" is the formula for?`, a:f.name,
     options:shuffle([f.name,...allFormulas.filter(x=>x.name!==f.name).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.name)])},
  ]).sort(()=>Math.random()-.5).slice(0,Math.min(20,sec.formulas.length*2));
  launchFormulaQuiz(qs, sec.name+' — All Formulas', sec.color);
}

// Core: launches the formula quiz modal
let _fqQs=[],_fqTitle='',_fqColor='#3b82f6';
function launchFormulaQuiz(qs, title, color){
  _fqQs=qs;_fqTitle=title;_fqColor=color;
  // Remove existing modal
  const old = document.getElementById('fq-modal');
  if(old) old.remove();

  let idx=0, score=0, answered=false, selected=null, history=[];

  function renderQ(){
    const modal = document.getElementById('fq-modal');
    if(!modal) return;
    if(idx >= qs.length){
      // Results
      const pct = Math.round(score/qs.length*100);
      const msg = pct===100?'Perfect! 🏆':pct>=80?'Excellent! 🔥':pct>=60?'Good! 👍':'Keep Practicing! 💪';
      const rows = history.map((h,i)=>`
        <div style="padding:6px 9px;border-radius:7px;background:${h.right?'rgba(16,185,129,.08)':'rgba(239,68,68,.08)'};border:1px solid ${h.right?'rgba(16,185,129,.2)':'rgba(239,68,68,.2)'};margin-bottom:4px;font-size:9px">
          <div style="font-weight:700;color:var(--white);margin-bottom:2px">${i+1}. ${h.q}</div>
          ${h.right?`<span style="color:#10b981">✓ ${h.correct}</span>`:`<span style="color:#ef4444">✗ ${h.selected}</span> <span style="color:#10b981">✓ ${h.correct}</span>`}
        </div>`).join('');
      modal.innerHTML = `
        <div style="background:var(--card);border:2px solid ${color}44;border-radius:16px;padding:20px;max-width:500px;width:92vw;max-height:85vh;overflow-y:auto;position:relative">
          <button onclick="document.getElementById('fq-modal').remove()" style="position:absolute;top:10px;right:12px;background:var(--red);border:none;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer">✕</button>
          <div style="text-align:center;margin-bottom:14px">
            <div style="font-size:9px;color:${color};font-weight:800;letter-spacing:1px;margin-bottom:4px">🔁 FORMULA REVISE — ${title}</div>
            <div style="font-size:38px;font-weight:900;color:${pct>=80?'#10b981':pct>=60?'#f59e0b':'#ef4444'};font-family:'JetBrains Mono',monospace">${score}/${qs.length}</div>
            <div style="font-size:18px;font-weight:800;margin-top:4px">${msg}</div>
            <div style="font-size:10px;color:var(--muted)">${pct}% correct</div>
          </div>
          <div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap">
            <button onclick="fqRetryFromResult()" style="padding:6px 16px;border-radius:8px;background:linear-gradient(135deg,${color},${color}aa);color:#fff;border:none;font-size:10px;font-weight:800;cursor:pointer">🔄 Retry</button>
            <button onclick="document.getElementById('fq-modal').remove()" style="padding:6px 16px;border-radius:8px;background:var(--card2);border:1px solid var(--border2);color:var(--text);font-size:10px;font-weight:700;cursor:pointer">✕ Close</button>
          </div>
          <div style="font-size:9px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:8px">REVIEW</div>
          ${rows}
        </div>`;
      return;
    }
    const q = qs[idx];
    const prog = Math.round((idx/qs.length)*100);
    const optHtml = (q.options||[q.a]).map((opt,oi2)=>{
      let bg='var(--card2)',border='var(--border2)',col='var(--text)';
      if(answered){
        if(opt===q.a){bg='rgba(16,185,129,.15)';border='#10b981';col='#10b981';}
        else if(opt===selected&&opt!==q.a){bg='rgba(239,68,68,.15)';border='#ef4444';col='#ef4444';}
      }
      const eid_fq='fqo3_'+idx+'_'+oi2;
      return `<button id="${eid_fq}" ${answered?'disabled':''}
        style="width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid ${border};background:${bg};color:${col};font-size:11px;font-weight:600;text-align:left;cursor:${answered?'default':'pointer'};margin-bottom:6px;transition:all .15s;font-family:'JetBrains Mono',monospace;line-height:1.4">
        ${opt}
      </button>`;
    }).join('');
    modal.innerHTML = `
      <div style="background:var(--card);border:2px solid ${color}44;border-radius:16px;padding:18px;max-width:500px;width:92vw;max-height:85vh;overflow-y:auto;position:relative">
        <button id="fq-old-close" style="position:absolute;top:10px;right:12px;background:var(--red);border:none;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer">✕</button>
        <div style="font-size:9px;color:${color};font-weight:800;letter-spacing:1px;margin-bottom:8px">🔁 REVISE: ${title}</div>
        <div style="height:4px;background:var(--border);border-radius:2px;margin-bottom:12px;overflow:hidden">
          <div style="height:100%;width:${prog}%;background:${color};border-radius:2px;transition:width .3s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:9px;color:var(--muted)">
          <span>${idx+1}/${qs.length}</span><span style="color:#10b981;font-weight:800">✓${score}</span>
        </div>
        <div style="font-size:14px;font-weight:800;color:var(--white);text-align:center;padding:12px;background:${color}10;border-radius:10px;border:1px solid ${color}25;margin-bottom:12px;line-height:1.5">
          ${q.q}
        </div>
        ${optHtml}
        ${answered?`<button id="fq-old-next-btn" style="width:100%;padding:9px;border-radius:9px;background:linear-gradient(135deg,${color},${color}aa);color:#fff;border:none;font-size:11px;font-weight:800;cursor:pointer;margin-top:4px">
          ${idx+1>=qs.length?'📊 See Results →':'Next →'}
        </button>`:''}
        ${answered&&selected!==q.a?`<div style="margin-top:8px;padding:7px 10px;background:rgba(16,185,129,.08);border-radius:8px;font-size:10px;color:#10b981;border:1px solid rgba(16,185,129,.2)">💡 <strong>${q.a}</strong></div>`:''}
      </div>`;

    // Attach all listeners safely after innerHTML (no inline onclick)
    setTimeout(()=>{
      const oc=document.getElementById('fq-old-close');
      if(oc) oc.addEventListener('click',()=>{const m=document.getElementById('fq-modal');if(m)m.remove();});
      (q.options||[q.a]).forEach((opt,oi2)=>{
        const el=document.getElementById('fqo3_'+idx+'_'+oi2);
        if(el) el.addEventListener('click',function(){if(!answered)window.fqAnswer(opt);});
      });
      const nb=document.getElementById('fq-old-next-btn');
      if(nb) nb.addEventListener('click',()=>window.fqNext());
    },0);
  }

  window.fqAnswer = function(opt){
    if(answered) return;
    answered=true; selected=opt;
    const right = opt===qs[idx].a;
    if(right) score++;
    history.push({q:qs[idx].q, selected:opt, correct:qs[idx].a, right});
    renderQ();
  };
  window.fqRetryFromResult=function(){launchFormulaQuiz(_fqQs||qs,_fqTitle||title,_fqColor||color);};
  window.fqNext = function(){
    idx++; answered=false; selected=null;
    renderQ();
  };

  // Create and show modal
  const overlay = document.createElement('div');
  overlay.id = 'fq-modal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);padding:16px;overflow-y:auto';
  overlay.onclick = function(e){if(e.target===overlay)overlay.remove();};
  document.body.appendChild(overlay);
  renderQ();
}

// REVISION PLANNER — Auto Tracker

function renderRevision(){
  const p = document.getElementById('panel-revision');
  if(!p) return;
  const today = tod();
  let revLog = gl('s60revlog',[]);

  // Sync revLog from subject data (always fresh)
  revLog = [];
  SKS.forEach(sk=>{
    const sub = SUBS[sk];
    const data = gT(sk);
    const tops = gTops(sub);
    tops.forEach(t=>{
      const row = data[String(t.id)]||{};
      const hasAnyRev = ['r01','r02','r03','r04','r05','r06','r07'].some(r=>row[r]);
      if(!hasAnyRev) return;
      revLog.push({
        sk, tid:String(t.id),
        subLabel:sub.label, subIcon:sub.icon||'📚', subColor:sub.color||'#3b82f6',
        topicName:t.name,
        startDate:row.startDate||null,
        completeDate:row.completeDate||null,
        addedOn:row.completeDate||row.startDate||today,
        r01:row.r01||null, r02:row.r02||null, r03:row.r03||null,
        r04:row.r04||null, r05:row.r05||null, r06:row.r06||null, r07:row.r07||null,
      });
    });
  });
  if(revLog.length) sl('s60revlog', revLog);

  // ── BUILD REVISION ENTRIES ──
  const REV_LABELS = {
    r01:{label:'R-1',days:'1d after',color:'#06b6d4'},
    r02:{label:'R-2',days:'3d after',color:'#8b5cf6'},
    r03:{label:'R-3',days:'7d after',color:'#10b981'},
    r04:{label:'R-4',days:'15d after',color:'#f59e0b'},
    r05:{label:'R-5',days:'31d after',color:'#ef4444'},
    r06:{label:'R-6',days:'63d after',color:'#ec4899'},
    r07:{label:'R-7',days:'127d after',color:'#a855f7'},
  };

  const overdue=[], dueToday=[], upcoming=[], completed=[];

  revLog.forEach(e=>{
    Object.entries(REV_LABELS).forEach(([key,meta])=>{
      if(!e[key]) return;
      const done = !!(gT(e.sk)[e.tid]?.[key+'_done']);
      const entry = {...e, revKey:key, revLabel:meta.label, revColor:meta.color, revDays:meta.days, revDate:e[key], done};
      if(done) completed.push(entry);
      else if(e[key] < today) overdue.push(entry);
      else if(e[key] === today) dueToday.push(entry);
      else upcoming.push(entry);
    });
  });

  overdue.sort((a,b)=>a.revDate.localeCompare(b.revDate));
  upcoming.sort((a,b)=>a.revDate.localeCompare(b.revDate));
  completed.sort((a,b)=>b.revDate.localeCompare(a.revDate));

  // ── NEXT WHAT TO STUDY ──
  const nextUp = [...dueToday, ...overdue, ...upcoming].slice(0,5);

  // ── 14-DAY TIMELINE ──
  const timeline = [];
  for(let i=0;i<14;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const items=[...dueToday,...upcoming].filter(e=>e.revDate===ds);
    timeline.push({date:ds, day:d.toLocaleDateString('en-IN',{weekday:'short'}), count:items.length, items});
  }

  // ── STREAK ──
  const streak = gl('s60revstreak',{date:'',count:0});

          <div style="font-size:18px;font-weight:900;line-height:1;color:${t.count>0?(t.date===today?'var(--amber)':'var(--cyan)'):'var(--border2)'}">${t.count||'·'}</div>
          ${t.count>0?`<div style="font-size:7px;color:var(--muted);margin-top:2px">${t.count} rev</div>`:''}

    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
      ${timeline.slice(7,14).map(t=>`
        <div style="text-align:center;padding:8px 3px;border-radius:9px;background:var(--card);border:1px solid var(--border)">
          <div style="font-size:7px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-weight:800">${t.day}</div>
          <div style="font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin:2px 0">${t.date.slice(5)}</div>
          <div style="font-size:18px;font-weight:900;line-height:1;color:${t.count>0?'var(--purple)':'var(--border2)'}">${t.count||'·'}</div>
          ${t.count>0?`<div style="font-size:7px;color:var(--muted);margin-top:2px">${t.count} rev</div>`:''}
        </div>`).join('')}

  </div>

  <!-- OVERDUE -->
  ${overdue.length?`<div class="pc" style="margin-bottom:14px;border-color:rgba(239,68,68,.35);background:linear-gradient(135deg,rgba(239,68,68,.04),transparent)">
    <div class="sl" style="color:var(--red)">🔴 Overdue — Revise Immediately! (${overdue.length})</div>

    <div class="sl" style="color:var(--amber)">🟡 Due Today (${dueToday.length})</div>

  <!-- UPCOMING 7 DAYS -->
  <div class="pc" style="margin-bottom:14px">
    <div class="sl" style="color:var(--cyan)">🔵 Upcoming — Next 7 Days (${upcoming.filter(e=>(new Date(e.revDate)-new Date())/864e5<=7).length})</div>

  </div>

  ${upcoming.filter(e=>{const d=(new Date(e.revDate)-new Date())/864e5;return d>7&&d<=30;}).length?`<div class="pc" style="margin-bottom:14px">
    <div class="sl" style="color:var(--purple)">🟣 Upcoming — 8–30 Days (${upcoming.filter(e=>{const d=(new Date(e.revDate)-new Date())/864e5;return d>7&&d<=30;}).length})</div>
    ${revCard(upcoming.filter(e=>{const d=(new Date(e.revDate)-new Date())/864e5;return d>7&&d<=30;}), '')}
  </div>`:''}

  <!-- FULL SCHEDULE per topic -->
  <div class="pc" style="margin-bottom:14px">
    <div class="sl" style="color:var(--green)">📋 Full Revision Schedule — All Topics</div>
    ${revLog.length===0?'<div style="color:var(--muted);font-size:11px;padding:12px;text-align:center">No topics scheduled yet. Mark topics as done in subject tracker to auto-schedule.</div>':
    revLog.map(e=>{
      const data = gT(e.sk);
      const row = data[e.tid]||{};
      const revEntries = Object.entries(REV_LABELS).map(([k,v])=>({key:k,...v,date:e[k],done:!!(row[k+'_done'])}));
      return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:14px">${e.subIcon}</span>
          <span style="font-size:11px;font-weight:700;color:var(--white)">${e.topicName}</span>

          ${e.completeDate?`<span style="font-size:7px;padding:1px 6px;border-radius:20px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#10b981;font-family:'JetBrains Mono',monospace">Done: ${e.completeDate}</span>`:''}
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${revEntries.map(rv=>rv.date?`
            <div style="padding:4px 8px;border-radius:7px;background:${rv.done?'rgba(16,185,129,.12)':rv.date<today?'rgba(239,68,68,.12)':rv.date===today?'rgba(245,158,11,.12)':'rgba(59,130,246,.06)'};border:1px solid ${rv.done?'rgba(16,185,129,.3)':rv.date<today?'rgba(239,68,68,.3)':rv.date===today?'rgba(245,158,11,.3)':'var(--border)'};text-align:center;min-width:52px">
              <div style="font-size:9px;font-weight:800;color:${rv.color};font-family:'JetBrains Mono',monospace">${rv.label}</div>
              <div style="font-size:7px;color:var(--muted);margin-top:1px;font-family:'JetBrains Mono',monospace">${rv.date.slice(5)}</div>
              <div style="font-size:8px;margin-top:2px">${rv.done?'✅':rv.date<today?'❗':rv.date===today?'📌':'⏳'}</div>
            </div>`:'').join('')}
        </div>
      </div>`;
    }).join('')}
  </div>

  <!-- COMPLETED -->
  ${completed.length?`<div class="pc">
    <div class="sl" style="color:var(--green)">✅ Completed Revisions (${completed.length})</div>
    ${revCard(completed.slice(0,15),'',true)}
    ${completed.length>15?`<div style="text-align:center;font-size:10px;color:var(--muted);margin-top:8px;padding:6px">+${completed.length-15} more completed</div>`:''}
  </div>`:''}`;

  // Attach Mark Done listeners safely
  [...overdue,...dueToday,...upcoming,...completed].forEach(e=>{
    const btn = document.getElementById(`revbtn-${e.sk}-${e.tid}-${e.revKey}`);
    if(btn && !e.done){
      btn.addEventListener('click', function(){
        markRevDone(e.sk, e.tid, e.revKey, this);
      });
    }
  });
}

function markRevDone(sk, tid, revKey, btn){
  const data = gT(sk);
  if(!data[tid]) data[tid]={};
  data[tid][revKey+'_done'] = true;
  sT(sk, data);
  // Update streak
  const today = tod();
  let streak = gl('s60revstreak',{date:'',count:0});
  if(streak.date===today) streak.count++;
  else streak={date:today,count:1};
  sl('s60revstreak',streak);
  fl('✅ Revision marked done! 🔥');
  if(btn){
    btn.textContent='✅ Done';
    btn.style.background='rgba(16,185,129,.12)';
    btn.style.color='#10b981';
    btn.style.borderColor='#10b981';
    btn.disabled=true;
  }
  setTimeout(()=>renderRevision(),300);
}

/*
  Data shape stored in localStorage key 's60dca':
  {
    "2026-06-11": [
      { id, title, category, source, notes,
        classYes, theoryYes, r01done, r02done, r03done, r04done, r05done,
        r01date, r02date, r03date, r04date, r05date }
    ],
    ...
  }
*/
const CA_CATS = ['National','International','Economy','Banking','Defence','Science & Tech',
                 'Sports','Awards','Appointments','Environment','Summits','Other'];
const CA_SOURCES = ['The Hindu','Indian Express','PIB','LiveMint','DD News','BBC','Other'];
const CA_REV_DAYS = {r01:1, r02:3, r03:7, r04:15, r05:31, r06:63, r07:127};

function getCAData(){ return gl('s60dca', {}); }
function setCAData(d){ sl('s60dca', d); }

function todayFmt(offset=0){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}
function fmtDate(ds){
  if(!ds) return '—';
  const d = new Date(ds);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function addCARevDates(item){
  const base = item.addedDate || todayFmt();
  Object.entries(CA_REV_DAYS).forEach(([k,days])=>{
    if(!item[k+'date']){
      const d = new Date(base); d.setDate(d.getDate()+days);
      item[k+'date'] = d.toISOString().slice(0,10);
    }
  });
  return item;
}

// Active date selection
let caSelDate = todayFmt();
let caFilter = 'All';
let caShowAdd = false;
let caEditId = null;

  const dateList = [...dateSet].sort((a,b)=>b.localeCompare(a)).slice(0,60);

  // Current date entries
  const entries = allData[caSelDate] || [];
  const filtered = caFilter==='All' ? entries : entries.filter(e=>e.category===caFilter);

  // Stats for today
  const todayEntries = allData[todayFmt()] || [];
  const totalAll = Object.values(allData).reduce((a,v)=>a+v.length,0);

  // Overdue revisions across all CA entries
  const today = todayFmt();
  let overdueCA = 0;

    ['r01','r02','r03','r04','r05','r06','r07'].forEach(r=>{
      if(e[r+'date'] && e[r+'date']<=today && !e[r+'done']) overdueCA++;
    });

  // Date selector bar
  const dateBtns = dateList.map(d=>{

      <div style="font-size:7px;color:${isSel?'#f97316':'var(--muted)'}">${d.slice(5,7)}</div>

  }).join('');

  const catTabs = ['All',...CA_CATS].map(c=>`<button onclick="caSetFilter('${c}')" style="padding:3px 9px;border-radius:5px;border:1px solid ${caFilter===c?'#f97316':'var(--border)'};background:${caFilter===c?'#f9731618':'transparent'};color:${caFilter===c?'#f97316':'var(--muted)'};font-size:8px;cursor:pointer;white-space:nowrap;font-family:'Rajdhani',sans-serif;font-weight:700">${c}</button>`).join('');

        style="padding:2px 8px;border-radius:4px;border:none;cursor:pointer;font-size:8px;font-weight:700;

      <div style="display:flex;gap:8px;align-items:flex-start">

            <span style="padding:1px 7px;border-radius:10px;background:#f9731618;border:1px solid #f9731640;color:#f97316;font-size:8px;font-weight:700">${e.category||'General'}</span>

          <div style="font-size:12px;font-weight:700;color:var(--white);margin-bottom:4px;line-height:1.4">${e.title}</div>
          ${e.notes?`<div style="font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.5">${e.notes}</div>`:''}
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <button onclick="caToggleClass('${caSelDate}','${e.id}',this)"
              style="padding:2px 8px;border-radius:4px;border:1px solid ${e.classYes?'#10b981':'var(--border2)'};background:${e.classYes?'#10b98118':'transparent'};color:${e.classYes?'#10b981':'var(--muted)'};font-size:8px;cursor:pointer;font-weight:700">
              ${e.classYes?'✓ Read':'Mark Read'}
            </button>
            ${revBadges}
            <button onclick="caEdit('${caSelDate}','${e.id}')" style="padding:2px 7px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:8px;cursor:pointer">✏️</button>
            <button onclick="caDel('${caSelDate}','${e.id}')" style="padding:2px 7px;border-radius:4px;border:none;background:#ef444418;color:#ef4444;font-size:8px;cursor:pointer;border:1px solid #ef444430">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('') : `<div style="text-align:center;padding:28px;color:var(--muted);font-size:12px">
    No entries for ${fmtDate(caSelDate)}. Click "Add Entry" to start! 📰
  </div>`;

  // Add/Edit form
  const editEntry = caEditId ? (allData[caSelDate]||[]).find(e=>e.id===caEditId) : null;
  const formHtml = `
  <div id="ca-add-form" style="display:${caShowAdd?'block':'none'};background:var(--surface);border:1px solid #f9731640;border-radius:10px;padding:14px;margin-bottom:14px">
    <div style="font-size:10px;font-weight:800;color:#f97316;margin-bottom:10px;letter-spacing:1px">${caEditId?'✏️ EDIT ENTRY':'➕ ADD CURRENT AFFAIR — ${fmtDate(caSelDate)}'}</div>
    <div style="display:grid;gap:8px">
      <div>
        <div style="font-size:7px;color:var(--muted);margin-bottom:2px;font-family:'JetBrains Mono',monospace">HEADLINE / TITLE *</div>
        <textarea class="inp" id="ca-title" rows="2" placeholder="e.g. India launches XYZ satellite into orbit…" style="width:100%;resize:vertical;font-size:12px">${editEntry?editEntry.title:''}</textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <div style="font-size:7px;color:var(--muted);margin-bottom:2px;font-family:'JetBrains Mono',monospace">CATEGORY</div>
          <select class="inp" id="ca-cat" style="width:100%">
            ${CA_CATS.map(c=>`<option${editEntry&&editEntry.category===c?' selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div>
          <div style="font-size:7px;color:var(--muted);margin-bottom:2px;font-family:'JetBrains Mono',monospace">SOURCE</div>

      </div>
      <div>
        <div style="font-size:7px;color:var(--muted);margin-bottom:2px;font-family:'JetBrains Mono',monospace">NOTES / KEY POINTS (optional)</div>
        <textarea class="inp" id="ca-notes" rows="2" placeholder="Key facts, who/what/where…" style="width:100%;resize:vertical;font-size:11px">${editEntry?editEntry.notes||'':''}</textarea>
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn bp2 bs" onclick="caSave()">💾 Save</button>
        <button class="btn bg2 bs" onclick="caCancelForm()">Cancel</button>
      </div>

  </div>`;

  p.innerHTML = `
  <!-- Header stats -->
  <div class="sg2" style="margin-bottom:12px">
    <div class="sc" style="border:1px solid #f9731622"><div class="sn" style="color:#f97316">${todayEntries.length}</div><div class="sl2">Today Added</div><div class="sb2" style="background:#f97316"></div></div>
    <div class="sc" style="border:1px solid #10b98122"><div class="sn" style="color:#10b981">${doneAll}</div><div class="sl2">Read Done</div><div class="sb2" style="background:#10b981"></div></div>
    <div class="sc" style="border:1px solid #2563eb22"><div class="sn" style="color:#2563eb">${totalAll}</div><div class="sl2">Total Entries</div><div class="sb2" style="background:#2563eb"></div></div>
    <div class="sc" style="border:1px solid #ef444422"><div class="sn" style="color:#ef4444">${overdueCA}</div><div class="sl2">Rev Overdue</div><div class="sb2" style="background:#ef4444"></div></div>
  </div>

  <!-- Date selector -->
  <div class="pc" style="margin-bottom:12px;padding:12px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">

    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">${dateBtns}</div>

    </div>
  </div>`;
}

// ── CA Helper functions ────────────────────────────────
function caSetDate(d){ caSelDate=d; caShowAdd=false; caEditId=null; renderDailyCA(); }
function caSetFilter(f){ caFilter=f; renderDailyCA(); }
function caOpenAdd(){ caShowAdd=true; caEditId=null; renderDailyCA(); setTimeout(()=>document.getElementById('ca-title')&&document.getElementById('ca-title').focus(),100); }
function caCancelForm(){ caShowAdd=false; caEditId=null; renderDailyCA(); }

function caSave(){
  const title = (document.getElementById('ca-title')||{}).value?.trim();
  if(!title) return fl('Headline लिखें!','#ef4444');
  const cat = (document.getElementById('ca-cat')||{}).value||'General';
  const src = (document.getElementById('ca-src')||{}).value||'Other';
  const notes = (document.getElementById('ca-notes')||{}).value?.trim()||'';
  const allData = getCAData();
  if(!allData[caSelDate]) allData[caSelDate]=[];
  if(caEditId){
    // Edit existing
    const idx = allData[caSelDate].findIndex(e=>e.id===caEditId);
    if(idx>=0){ allData[caSelDate][idx]={...allData[caSelDate][idx],title,category:cat,source:src,notes}; }
    fl('Updated!');
  } else {
    // New entry — auto-fill revision dates
    let item = { id:'ca'+Date.now(), title, category:cat, source:src, notes,
      addedDate:caSelDate, classYes:false,
      r01date:'',r02date:'',r03date:'',r04date:'',r05date:'',
      r01done:false,r02done:false,r03done:false,r04done:false,r05done:false };
    item = addCARevDates(item);
    allData[caSelDate].push(item);
    fl('Entry added!');
  }
  setCAData(allData);
  caShowAdd=false; caEditId=null;
  renderDailyCA();
}

function caEdit(date, id){
  caSelDate=date; caEditId=id; caShowAdd=true;
  renderDailyCA();
  setTimeout(()=>{ const t=document.getElementById('ca-title'); if(t)t.focus(); },100);
}

function caDel(date, id){
  if(!confirm('Delete this entry?')) return;
  const allData = getCAData();
  if(allData[date]) allData[date]=allData[date].filter(e=>e.id!==id);
  setCAData(allData); fl('Deleted','#ef4444'); renderDailyCA();
}

function caToggleClass(date, id, btn){
  const allData = getCAData();
  const entry = (allData[date]||[]).find(e=>e.id===id);
  if(!entry) return;
  entry.classYes = !entry.classYes;
  setCAData(allData);
  btn.textContent = entry.classYes?'✓ Read':'Mark Read';
  btn.style.background = entry.classYes?'#10b98118':'transparent';
  btn.style.color = entry.classYes?'#10b981':'var(--muted)';
  btn.style.borderColor = entry.classYes?'#10b981':'var(--border2)';
  // Update card border
  const card = btn.closest('[style*="border-left"]');
  if(card) card.style.borderLeft=`3px solid ${entry.classYes?'#10b981':'#f97316'}`;
}

function caMarkRev(date, id, revKey, btn){
  const allData = getCAData();
  const entry = (allData[date]||[]).find(e=>e.id===id);
  if(!entry) return;
  entry[revKey+'done'] = !entry[revKey+'done'];
  setCAData(allData);
  const done = entry[revKey+'done'];
  btn.textContent = done?'✓':revKey.replace('r0','R');
  btn.style.background = done?'#10b981':'var(--border2)';
  btn.style.color = done?'#000':'var(--muted)';
  btn.style.borderColor = done?'#10b981':'var(--border2)';
  fl(done?'✅ Revised!':'Unmarked');
}
